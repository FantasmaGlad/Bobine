[package]
name = "bobine-media"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
lofty = "=0.25.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
