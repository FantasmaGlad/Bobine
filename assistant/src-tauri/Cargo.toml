[package]
name = "bobine-assistant"
version = "0.1.0"
edition = "2021"
description = "Assistant d'installation graphique et télécommande de bureau Bobine (Tauri 2)"
license = "AGPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
bobine-installer-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
if-addrs = "0.15"
dns-lookup = "4"
tauri-plugin-updater = "2"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"

# libssh2 a besoin d'OpenSSL : celui du système sous Linux, compilé avec l'assistant sous Windows et macOS, qui n'en
# fournissent pas d'utilisable.
[target.'cfg(target_os = "linux")'.dependencies]
ssh2 = "0.9"

[target.'cfg(not(target_os = "linux"))'.dependencies]
ssh2 = { version = "0.9", features = ["vendored-openssl"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[features]
default = []
