# Configuration Dependabot — Bobine
# Mises à jour hebdomadaires groupées par écosystème.
# Aucun auto-merge : revue manuelle par le mainteneur.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      backend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/assistant"
    schedule:
      interval: "weekly"
    groups:
      assistant-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    groups:
      android-dependencies:
        patterns:
          - "*"
    ignore:
      # Chaquopy 17.0 teste et garantit la compatibilité jusqu'à AGP 9.2.x maximum
      - dependency-name: "com.android.application"
      - dependency-name: "com.android.tools.build:gradle"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
    ignore:
      # Évite les ruptures majeures en bloc sur les actions de CI et packaging multi-OS
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
