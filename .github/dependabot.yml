# Réf. docs/cahier-des-charges-securite-hygiene-2026-09.md §4 : ouvre des PR
# de mise à jour de dépendances, groupées par écosystème pour limiter le
# bruit — aucun auto-merge, revue et fusion restent manuelles.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      backend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/assistant"
    schedule:
      interval: "weekly"
    groups:
      assistant-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    groups:
      android-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
