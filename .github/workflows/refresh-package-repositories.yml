name: Rafraîchir les dépôts de paquets

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Essai sans publication : ré-exporte, re-signe et vérifie la copie locale, affiche le changement, ne pousse rien.
          Décocher pour publier réellement.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-linux-packages
  cancel-in-progress: false

env:
  APT_OPTIONS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30

jobs:
  refresh:
    name: Ré-exporter et re-signer les fichiers Release APT
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FantasmaGlad/bobine-packages
          ref: gh-pages
          path: package-repo
          ssh-key: ${{ secrets.PACKAGES_DEPLOY_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FantasmaGlad/BobineWeb
          ref: 9051a451b39639c875fa5cc84897e79f7639d278
          path: package-verification
      - name: Installer les outils de dépôt
        run: sudo apt-get $APT_OPTIONS update && sudo apt-get $APT_OPTIONS install -y reprepro gnupg
      - name: Ré-exporter et re-signer les fichiers Release
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          GNUPGHOME: ${{ runner.temp }}/bobine-signing
        run: |
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          bash scripts/ci/refresh-apt-release.sh package-repo
      - name: Vérifier toute la chaîne avant publication
        run: |
          python3 package-verification/deploy/onion/verify-packages.py package-repo
      - name: Publier sur gh-pages
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          bash scripts/ci/commit-package-repository.sh package-repo "chore(packages): rafraichir les fichiers Release du depot debian"
      - name: Retirer la clé privée du runner
        if: always()
        env:
          GNUPGHOME: ${{ runner.temp }}/bobine-signing
        run: |
          gpgconf --kill gpg-agent || true
          rm -rf "$GNUPGHOME"
