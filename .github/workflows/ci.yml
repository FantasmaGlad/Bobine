  macos-build:
    # PyInstaller ne cross-compile pas — ce
    # job est le seul endroit où le packaging macOS (bobine.spec, BUNDLE())
    # est réellement construit sur un vrai macOS. Écrit d'après la
    # documentation officielle PyInstaller/Apple (aucune machine macOS dans
    # l'environnement de développement) — jamais exécuté tel quel avant son
    # premier passage ici, à surveiller de près.
    # `macos-latest` est arm64 uniquement depuis macOS 14 (pas de x86_64 par
    # défaut) : l'étape de signature ad-hoc est OBLIGATOIRE sur ce runner —
    # sans elle, le noyau (AMFI) tue au lancement tout binaire/bibliothèque
    # figé non signé sur Apple Silicon ("Killed: 9"), indépendamment de tout
    # avertissement Gatekeeper.
    name: macOS packaging (PyInstaller + dmg)
    runs-on: macos-latest
    needs: [version]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build du frontend (export statique)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Installer les dépendances Python + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller
      - name: Identifiants de build (VERSION bundlée + COMMIT)
        run: |
          echo "${{ needs.version.outputs.commit_short }}" > COMMIT
          if [ "${{ needs.version.outputs.channel }}" = "beta" ] || [ "${{ needs.version.outputs.channel }}" = "canary" ]; then
            echo "${{ needs.version.outputs.display_version }}" > VERSION
          fi
      - name: Construire Bobine.app
        working-directory: backend
        run: pyinstaller ../packaging/macos/bobine.spec
      # Fenêtre native du projecteur : tests puis binaire
      # release, copié dans le bundle AVANT la signature ad-hoc ci-dessous.
      - name: Tester et construire la fenêtre native du projecteur
        working-directory: projector
        # Nouvelles tentatives réseau : le téléchargement de l'index crates.io a
        # déjà échoué une fois sur une panne DNS passagère du runner. `--locked`
        # impose Cargo.lock (build reproductible).
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "60"
        run: |
          cargo test --locked
          cargo build --release --locked
          cp target/release/bobine-projector ../backend/dist/Bobine.app/Contents/MacOS/bobine-projector
      - name: Tester et construire le sidecar des périphériques
        working-directory: devices
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "60"
        run: |
          cargo test --locked
          cargo build --release --locked
          cp target/release/bobine-devices ../backend/dist/Bobine.app/Contents/MacOS/bobine-devices
      - name: Compiler et embarquer le composant audio natif
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "60"
        run: python3 scripts/ci/stage-media.py --dest backend/dist/Bobine.app/Contents/MacOS
      - name: Vérifier la présence de l'icône dans le bundle
        run: test -f backend/dist/Bobine.app/Contents/Resources/bobine.icns
      - name: Signature ad-hoc (requise par le noyau sur Apple Silicon)
        run: codesign --force --deep -s - backend/dist/Bobine.app
      - name: Vérifier que BobineBackend démarre et répond à /api/health
        working-directory: backend/dist/Bobine.app/Contents/MacOS
        run: |
          ./BobineBackend &
          PID=$!
          sleep 5
          curl -sf http://127.0.0.1:8000/api/health
          kill "$PID"
      - name: Créer le .dmg (hdiutil)
        env:
          DMG_FILENAME_VERSION: ${{ needs.version.outputs.filename_version }}
        run: |
          mkdir -p dmg-root dist-dmg
          cp -R backend/dist/Bobine.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Bobine" -srcfolder dmg-root -ov -format UDZO "dist-dmg/Bobine-${DMG_FILENAME_VERSION}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: bobine-macos-dmg
          path: dist-dmg/*.dmg

  # Publie une release STABLE — un tag Vx.y.z par version, historique normal
  # et attendu sur la page GitHub Releases.
  # Statut unique à exiger dans la protection de la branche main : vert seulement si tous les
  # contrôles de validation (hors publication) sont verts.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [version, frontend, firefox-smoke, backend, devices-sidecar, media-component, assistant-core, assistant-core-arm64, android-build, install-script, windows-build, windows-build-arm64, linux-desktop-deb, linux-desktop-deb-arm64, macos-build]
    runs-on: ubuntu-latest
    steps:
      - name: Tous les contrôles sont verts
        run: |
          set -eu
          results='${{ join(needs.*.result, ' ') }}'
          echo "résultats : $results"
          for r in $results; do
            [ "$r" = "success" ] || { echo "::error::un contrôle a échoué ou a été ignoré ($r)"; exit 1; }
          done

  release-stable:
    name: Publish Stable Release
    needs: [version, backend, frontend, windows-build, windows-build-arm64, linux-desktop-deb, linux-desktop-deb-arm64, macos-build, assistant-core, assistant-core-arm64, android-build]
    if: needs.version.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release assets directory
        run: mkdir -p release-assets
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: bobine-windows-installer
          path: release-assets
      - name: Download Windows ARM64 installer
        uses: actions/download-artifact@v4
        with:
          name: bobine-windows-installer-arm64
          path: release-assets
      - name: Download Linux deb
        uses: actions/download-artifact@v4
        with:
          name: bobine-linux-deb
          path: release-assets
      - name: Download Linux ARM64 deb
        uses: actions/download-artifact@v4
        with:
          name: bobine-linux-deb-arm64
          path: release-assets
      - name: Download macOS dmg
        uses: actions/download-artifact@v4
        with:
          name: bobine-macos-dmg
          path: release-assets
      - name: Download Linux assistant binary
        uses: actions/download-artifact@v4
        with:
          name: bobine-assistant-linux
          path: release-assets
      - name: Download Linux ARM64 assistant binary
        uses: actions/download-artifact@v4
        with:
          name: bobine-assistant-linux-arm64
          path: release-assets
      - name: Download Android APK
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bobine-android-apk
          path: android-artifact
      - name: Download Android TV APK
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bobine-android-tv-apk
          path: android-tv-artifact
      - name: Prepare Android APK assets
        run: |
          if [ -d "android-artifact" ] && compgen -G "android-artifact/*.apk" > /dev/null; then
            APK_SRC=$(ls android-artifact/*.apk | head -1)
            cp "$APK_SRC" "release-assets/Bobine-${{ needs.version.outputs.filename_version }}.apk"
            echo "Android APK copié : release-assets/Bobine-${{ needs.version.outputs.filename_version }}.apk"
          else
            echo "Aucun APK Android trouvé dans l'artefact."
          fi
          if [ -d "android-tv-artifact" ] && compgen -G "android-tv-artifact/*.apk" > /dev/null; then
            APK_TV_SRC=$(ls android-tv-artifact/*.apk | head -1)
            cp "$APK_TV_SRC" "release-assets/Bobine-TV-${{ needs.version.outputs.filename_version }}.apk"
            echo "Android TV APK copié : release-assets/Bobine-TV-${{ needs.version.outputs.filename_version }}.apk"
          else
