            echo "Android TV APK copié : release-assets/Bobine-TV-canary.apk"
          else
            echo "Aucun APK Android TV trouvé dans l'artefact."
          fi
      - name: Copy install script into release assets
        run: cp install.sh release-assets/
      - name: Vérifier la complétude des assets
