          NOTES_EOF
          sed -i "s/__COMMIT__/${{ needs.version.outputs.commit_short }}/; s/__VERSION__/${{ needs.version.outputs.base_version }}/" /tmp/beta-notes.md

          # Bloc dynamique (changelog) ajouté à part, pas via sed : un message
          # de commit peut contenir '/', '&' ou d'autres caractères qui
          # casseraient une substitution sed, et un fence de code (```) rend le
          # changelog bien plus lisible qu'un paragraphe brut (le Markdown
          # fusionne des lignes consécutives sans ligne vide entre elles).
          LAST_STABLE="$(git tag --list 'V*' --sort=-v:refname | grep -E '^V[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          if [ -n "${LAST_STABLE}" ]; then
            CHANGELOG_HEADING="Changements depuis ${LAST_STABLE}"
            CHANGELOG="$(git log "${LAST_STABLE}..HEAD" --oneline --no-merges | head -50)"
          else
            CHANGELOG_HEADING="Changements récents"
            CHANGELOG="$(git log --oneline --no-merges | head -50)"
          fi
          {
            echo "---"
            echo ""
            echo "## ${CHANGELOG_HEADING}"
            echo ""
            echo '```'
            echo "${CHANGELOG}"
            echo '```'
            echo ""
            echo "---"
            echo ""
            echo "Retour à la Stable à tout moment, sans perte de données : Réglages → Mises à jour logicielles → Canal de mise à jour → Stable."
          } >> /tmp/beta-notes.md
          echo "notes_path=/tmp/beta-notes.md" >> "$GITHUB_OUTPUT"
      - name: Delete previous Beta release (assets get fully replaced, not merged)
        run: gh release delete beta --yes || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish Beta release
        run: |
          gh release create beta release-assets/* \
            --title "Bobine — Bêta (lot curé)" \
            --notes-file "${{ steps.notes.outputs.notes_path }}" \
            --prerelease \
            --target "${{ github.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}

  # Met à jour automatiquement le dépôt APT officiel (apt.bobine.fit) sur gh-pages
  # dès qu'une release Stable, Bêta ou Canary a été publiée avec succès.
  publish-apt-repo:
    name: Publish to APT Repository (apt.bobine.fit)
    needs: [version, linux-desktop-deb, linux-desktop-deb-arm64, release-stable, release-beta, release-canary]
    if: |
      always() &&
      !cancelled() &&
      (needs.release-stable.result == 'success' || needs.release-beta.result == 'success' || needs.release-canary.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Sérialise les publications sur gh-pages (groupe FIXE, pas ${{ github.ref
    # }}) : un tag Vx.y.z (Stable) et un push sur main (Canary, cf. fix
    # précédent republiant l'ancienne Bêta rolling en continu) peuvent se
    # déclencher à quelques secondes d'intervalle et courir en parallèle sur
    # des refs différentes — sans ce verrou, les deux jobs checkoutent
    # gh-pages en même temps et le second `git push` est rejeté.
    # cancel-in-progress: false — toutes les publications doivent aboutir,
    # seulement l'une après l'autre.
    concurrency:
      group: publish-apt-repo
      cancel-in-progress: false
    steps:
      - name: Install reprepro
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: apt-repo

      - name: Download Linux deb artifact (amd64)
        uses: actions/download-artifact@v4
        with:
          name: bobine-linux-deb
          path: deb-artifact

      - name: Download Linux deb artifact (arm64)
        uses: actions/download-artifact@v4
        with:
          name: bobine-linux-deb-arm64
          path: deb-artifact

      - name: Import GPG Private Key
        run: |
          echo "${{ secrets.APT_GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Update reprepro repository (amd64 + arm64)
        run: |
          CHANNEL="${{ needs.version.outputs.channel }}"
          DEB_AMD64=$(ls deb-artifact/*_amd64.deb | head -1)
          DEB_ARM64=$(ls deb-artifact/*_arm64.deb | head -1)
          echo "Mise à jour du dépôt APT pour le canal ${CHANNEL} avec ${DEB_AMD64} et ${DEB_ARM64}"

          cd apt-repo
          if [ -f "conf/distributions" ] && ! grep -q "arm64" conf/distributions; then
            sed -i 's/^Architectures: amd64$/Architectures: amd64 arm64/' conf/distributions
          fi
          if [ "$CHANNEL" = "beta" ] || [ "$CHANNEL" = "canary" ]; then
            # Canaux rolling (Bêta curée comme Canary) : on retire l'ancien
            # paquet pour ne garder que la dernière version publiée sur ce
            # canal, paramétré par $CHANNEL (déclaré dans conf/distributions
            # sur gh-pages).
            reprepro remove "$CHANNEL" bobine || true
            reprepro includedeb "$CHANNEL" "../$DEB_AMD64"
            reprepro includedeb "$CHANNEL" "../$DEB_ARM64"
          else
            # Sur le canal stable
            # Republication d'une même version Stable (correctif de build sans
            # incrément) : reprepro refuse un paquet de même version mais
            # d'empreinte différente, on retire donc d'abord l'ancien.
            DEB_VERSION="$(dpkg-deb -f "../$DEB_AMD64" Version)"
            if reprepro list stable bobine | grep -q " ${DEB_VERSION}\$"; then
              reprepro remove stable bobine
            fi
            reprepro includedeb stable "../$DEB_AMD64"
            reprepro includedeb stable "../$DEB_ARM64"
          fi

      - name: Purge des paquets non référencés du pool
        run: |
          # Le pool de gh-pages grossissait à chaque publication (un fichier .deb par
          # version Bêta/Canary, jamais supprimé) jusqu'à dépasser la limite de 1 Go
          # de GitHub Pages. On ne garde que les fichiers cités par un index Packages
          # (un par canal et par architecture) : sans état, donc sans risque pour les
          # autres canaux dont la base reprepro n'est pas conservée.
          cd apt-repo
          cat dists/*/main/binary-*/Packages | sed -n 's/^Filename: //p' | sort -u > ../referenced.txt
          if [ ! -s ../referenced.txt ]; then
            echo "Aucun index Packages lisible : purge ignorée."
            exit 0
          fi
          find pool -type f | sort > ../pool-files.txt
          comm -23 ../pool-files.txt ../referenced.txt > ../stale.txt
          echo "$(wc -l < ../stale.txt) fichier(s) obsolète(s) retiré(s) du pool"
          xargs -r -d '\n' rm -f -- < ../stale.txt
          find pool -type d -empty -delete

      - name: Commit and push changes to gh-pages
        run: |
          cd apt-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A conf/ dists/ pool/
          if git diff --staged --quiet; then
            echo "Aucune modification à publier dans le dépôt APT."
          else
            git commit -m "chore(apt): mise à jour du dépôt APT (${{ needs.version.outputs.channel }})"
            git push origin gh-pages
          fi


