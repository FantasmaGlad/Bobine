          <p align="center">
            <img alt="Bobine" src="https://raw.githubusercontent.com/FantasmaGlad/Bobine/main/Assets/Images/LogoBanniere.png" width="100%">
          </p>

          <p align="center">
            <img alt="Bobine — Canal Canary" src="https://raw.githubusercontent.com/FantasmaGlad/Bobine/main/Assets/Images/Versions/Canary.png" width="220">
          </p>

          # Bobine — Canary (build automatique)

          > **Canal Canary (rolling).** Pre-release construite automatiquement depuis le tout dernier commit de `main`, sans aucune curation — pour les développeurs et utilisateurs avancés souhaitant suivre le développement au jour le jour. Une version stable équivalente ou plus récente la remplace toujours automatiquement.

          Pre-release construite depuis le tout dernier commit de `main`, sans aucune curation — reconstruite automatiquement à chaque push et republiée **en place** sur ce même tag mobile `canary` (jamais un nouveau tag par itération). Une version stable équivalente ou plus récente la remplace toujours automatiquement.

          Réservée aux utilisateurs ayant activé le canal Canary (Réglages → Mises à jour, `install.sh --channel=canary`, ou l'assistant Tauri). Pour un accès anticipé moins volatil, voir le [canal Bêta](https://github.com/FantasmaGlad/Bobine/releases/tag/beta) (lots curés, publication manuelle).

          **Basé sur** commit `__COMMIT__` · version à venir `__VERSION__`

          Le lot d’optimisation 5.0.3 est inclus. Les essais sur les appareils restent nécessaires avant sa promotion Stable.

          ---

          ## Téléchargement

          | Plateforme | Format | Architecture | Téléchargement direct |
          | :--- | :---: | :---: | :--- |
          | ![](https://img.shields.io/badge/Windows_11-0078D4?style=flat-square&logo=windows11&logoColor=white) | `.exe` | x86-64 / ARM64 | [**Bobine-Setup-canary.exe**](https://github.com/FantasmaGlad/Bobine/releases/download/canary/Bobine-Setup-canary.exe) (x86-64)<br>[**Bobine-Setup-canary-arm64.exe**](https://github.com/FantasmaGlad/Bobine/releases/download/canary/Bobine-Setup-canary-arm64.exe) (ARM64 Snapdragon) |
          | ![](https://img.shields.io/badge/Android-34A853?style=flat-square&logo=android&logoColor=white) | `.apk` | ARM64 | [**Bobine-canary.apk**](https://github.com/FantasmaGlad/Bobine/releases/download/canary/Bobine-canary.apk) |
          | ![](https://img.shields.io/badge/Android_TV-009688?style=flat-square&logo=androidtv&logoColor=white) | `.apk` | ARM 32/64 bits | [**Bobine-TV-canary.apk**](https://github.com/FantasmaGlad/Bobine/releases/download/canary/Bobine-TV-canary.apk) |
          | ![](https://img.shields.io/badge/Debian-A81D33?style=flat-square&logo=debian&logoColor=white) ![](https://img.shields.io/badge/Ubuntu-E95420?style=flat-square&logo=ubuntu&logoColor=white) | `.deb` | x86-64 / ARM64 | [**bobine_canary_amd64.deb**](https://github.com/FantasmaGlad/Bobine/releases/download/canary/bobine_canary_amd64.deb) (amd64)<br>[**bobine_canary_arm64.deb**](https://github.com/FantasmaGlad/Bobine/releases/download/canary/bobine_canary_arm64.deb) (arm64) |
          | ![](https://img.shields.io/badge/macOS-000000?style=flat-square&logo=apple&logoColor=white) | `.dmg` | Apple Silicon | [**Bobine-canary.dmg**](https://github.com/FantasmaGlad/Bobine/releases/download/canary/Bobine-canary.dmg) |
          | ![](https://img.shields.io/badge/Bobine_Assistant-FFC131?style=flat-square&logo=tauri&logoColor=black) | Binaire natif | x86-64 / ARM64 (Linux) | [**bobine-assistant**](https://github.com/FantasmaGlad/Bobine/releases/download/canary/bobine-assistant) (x86-64)<br>[**bobine-assistant-arm64**](https://github.com/FantasmaGlad/Bobine/releases/download/canary/bobine-assistant-arm64) (ARM64) |
          | ![](https://img.shields.io/badge/Bash_CLI-4EAA25?style=flat-square&logo=gnubash&logoColor=white) | Script | x86-64 / ARM64 | [**install.sh**](https://github.com/FantasmaGlad/Bobine/releases/download/canary/install.sh) — ou `sudo ./install.sh --channel=canary` sur une installation existante |

          NOTES_EOF
          sed -i "s/__COMMIT__/${{ needs.version.outputs.commit_short }}/; s/__VERSION__/${{ needs.version.outputs.base_version }}/" /tmp/canary-notes.md

          # Bloc dynamique (changelog) ajouté à part, pas via sed : un message
          # de commit peut contenir '/', '&' ou d'autres caractères qui
          # casseraient une substitution sed, et un fence de code (```) rend le
          # changelog bien plus lisible qu'un paragraphe brut (le Markdown
          # fusionne des lignes consécutives sans ligne vide entre elles).
          LAST_STABLE="$(git tag --list 'V*' --sort=-v:refname | grep -E '^V[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          if [ -n "${LAST_STABLE}" ]; then
            CHANGELOG_HEADING="Changements depuis ${LAST_STABLE}"
            CHANGELOG="$(git log "${LAST_STABLE}..HEAD" --oneline --no-merges | head -50)"
          else
            CHANGELOG_HEADING="Changements récents"
            CHANGELOG="$(git log --oneline --no-merges | head -50)"
          fi
          {
            echo "---"
            echo ""
            echo "## ${CHANGELOG_HEADING}"
            echo ""
            echo '```'
            echo "${CHANGELOG}"
            echo '```'
            echo ""
            echo "---"
            echo ""
            echo "Retour à la Stable à tout moment, sans perte de données : Réglages → Mises à jour logicielles → Canal de mise à jour → Stable."
          } >> /tmp/canary-notes.md
          echo "notes_path=/tmp/canary-notes.md" >> "$GITHUB_OUTPUT"
      - name: Delete previous Canary release (assets get fully replaced, not merged)
        run: gh release delete canary --yes || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish Canary release
        run: |
          gh release create canary release-assets/* \
            --title "Bobine — Canary (build automatique)" \
            --notes-file "${{ steps.notes.outputs.notes_path }}" \
            --prerelease \
            --target "${{ github.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}

