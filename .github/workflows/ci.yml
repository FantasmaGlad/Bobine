      - name: Installer les dépendances Python + PyInstaller
        run: |
          python -m pip install pip==26.2.2
          python -m pip install -r backend/requirements.txt
          python -m pip install -r backend/requirements-build.txt
          python -m pip check
      - name: Identifiants de build (VERSION bundlée + COMMIT)
        run: |
          echo "${{ needs.version.outputs.commit_short }}" > COMMIT
          if [ "${{ needs.version.outputs.channel }}" = "beta" ] || [ "${{ needs.version.outputs.channel }}" = "canary" ]; then
            echo "${{ needs.version.outputs.display_version }}" > VERSION
          fi
      - name: Construire Bobine.app
        working-directory: backend
        run: pyinstaller ../packaging/macos/bobine.spec
      - name: Tester et construire la fenêtre native du projecteur
        working-directory: projector
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "60"
        run: |
          cargo test --locked
          cargo build --release --locked
          cp target/release/bobine-projector ../backend/dist/Bobine.app/Contents/MacOS/bobine-projector
      - name: Tester et construire le sidecar des périphériques
        working-directory: devices
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "60"
        run: |
          cargo test --locked
          cargo build --release --locked
          cp target/release/bobine-devices ../backend/dist/Bobine.app/Contents/MacOS/bobine-devices
      - name: Compiler et embarquer le composant audio natif
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "60"
        run: python3 scripts/ci/stage-media.py --dest backend/dist/Bobine.app/Contents/MacOS
      - name: Vérifier la présence de l'icône dans le bundle
        run: test -f backend/dist/Bobine.app/Contents/Resources/bobine.icns
      - name: Signature ad-hoc (requise par le noyau sur Apple Silicon)
        run: codesign --force --deep -s - backend/dist/Bobine.app
      - name: Vérifier que BobineBackend démarre et répond à /api/health
        run: scripts/ci/smoke-macos-backend.sh backend/dist/Bobine.app/Contents/MacOS/BobineBackend --home "$RUNNER_TEMP/bobine-dist-home" --log-dir "$RUNNER_TEMP/bobine-dist-logs"
      - name: Créer le .dmg (hdiutil)
        env:
          DMG_FILENAME_VERSION: ${{ needs.version.outputs.filename_version }}
        run: |
          mkdir -p dmg-root dist-dmg
          cp -R backend/dist/Bobine.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Bobine" -srcfolder dmg-root -ov -format UDZO "dist-dmg/Bobine-${DMG_FILENAME_VERSION}.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 3 }}
          name: bobine-macos-dmg
          path: dist-dmg/*.dmg
          if-no-files-found: error
      - name: Monter le .dmg, copier Bobine.app et lancer son backend
        env:
          DMG_FILENAME_VERSION: ${{ needs.version.outputs.filename_version }}
        run: scripts/ci/smoke-macos-dmg.sh "dist-dmg/Bobine-${DMG_FILENAME_VERSION}.dmg" "$RUNNER_TEMP/bobine-dmg"

  linux-packages:
    name: Paquets DNF et pacman (${{ matrix.arch }})
    needs: [version, linux-deb]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            artifact: bobine-linux-deb
          - arch: aarch64
            artifact: bobine-linux-deb-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: deb-input
      - name: Outils de contrôle des archives
        run: sudo apt-get $APT_OPTIONS update && sudo apt-get $APT_OPTIONS install -y rpm zstd
      - name: Construire et vérifier les paquets
        env:
          FILENAME_VERSION: ${{ needs.version.outputs.filename_version }}
        run: |
          deb="$(find deb-input -name '*.deb' | head -1)"
          bash scripts/ci/build-linux-packages.sh "$deb" '${{ matrix.arch }}'
          bash scripts/ci/check-package-parity.sh "$deb" "$(find dist-rpm -name '*.rpm' | head -1)" "$(find dist-arch -name '*.pkg.tar.zst' | head -1)"
      - name: Vérifier que le rpm est refusé sur AlmaLinux 9 (plancher glibc)
        if: matrix.arch == 'x86_64'
        run: bash scripts/ci/test-glibc-floor.sh rpm "$(find dist-rpm -name '*.x86_64.rpm' | head -1)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 3 }}
          name: bobine-linux-packages-${{ matrix.arch }}
          path: |
            dist-rpm/*.rpm
            dist-arch/*.pkg.tar.zst
          if-no-files-found: error

  linux-rpm-aarch64:
    name: Paquet DNF aarch64 installé et lancé (Fedora arm64)
    needs: [linux-packages]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobine-linux-packages-aarch64
          path: rpm-input
      - name: Installer et lancer le rpm dans Fedora arm64
        run: |
          . scripts/ci/container-images.sh
          rpm="$(find rpm-input -name '*.aarch64.rpm' | head -1)"
          test -n "$rpm"
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/$(dirname "$rpm"):/pkg:ro" "$FEDORA_IMAGE" \
            bash -c 'test "$(uname -m)" = aarch64 && dnf -y -q install desktop-file-utils && /src/packaging/rpm/test_rpm.sh "$1"' -- "/pkg/$(basename "$rpm")"
      - name: Vérifier que le rpm est refusé sur AlmaLinux 9 arm64 (plancher glibc)
        run: bash scripts/ci/test-glibc-floor.sh rpm "$(find rpm-input -name '*.aarch64.rpm' | head -1)"

  ci-ok:
    name: ci-ok
    if: always()
    needs: [version, frontend, firefox-smoke, backend, backend-android-compat, android-startup, devices-sidecar, media-component, android-build, install-script, windows-build, windows-build-arm64, linux-deb, macos-build, linux-packages, linux-rpm-aarch64]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tous les contrôles sont verts
        env:
          CODE: ${{ needs.version.outputs.code }}
          FRONTEND: ${{ needs.version.outputs.frontend }}
          INSTALL: ${{ needs.version.outputs.install }}
          PACKAGING: ${{ needs.version.outputs.packaging }}
          ANDROID: ${{ needs.version.outputs.android }}
          MEDIA: ${{ needs.version.outputs.media }}
          DEVICES: ${{ needs.version.outputs.devices }}
        run: |
          set -eu
          [ "${{ needs.version.result }}" = success ] || { echo "::error::job version en échec"; exit 1; }
          controle() {
            echo "$1 : $2 (attendu : $3)"
            [ "$2" = success ] || { [ "$3" = false ] && [ "$2" = skipped ]; } || { echo "::error::$1 a échoué ou a été ignoré ($2)"; exit 1; }
          }
          controle frontend "${{ needs.frontend.result }}" "$FRONTEND"
          controle firefox-smoke "${{ needs.firefox-smoke.result }}" "$CODE"
          controle backend "${{ needs.backend.result }}" "$CODE"
          controle backend-android-compat "${{ needs.backend-android-compat.result }}" "$CODE"
          controle install-script "${{ needs.install-script.result }}" "$INSTALL"
          controle devices-sidecar "${{ needs.devices-sidecar.result }}" "$DEVICES"
          controle media-component "${{ needs.media-component.result }}" "$MEDIA"
          controle android-build "${{ needs.android-build.result }}" "$ANDROID"
          controle android-startup "${{ needs.android-startup.result }}" "$ANDROID"
          controle windows-build "${{ needs.windows-build.result }}" "$PACKAGING"
          controle windows-build-arm64 "${{ needs.windows-build-arm64.result }}" "$PACKAGING"
          controle linux-deb "${{ needs.linux-deb.result }}" "$PACKAGING"
          controle macos-build "${{ needs.macos-build.result }}" "$PACKAGING"
          controle linux-packages "${{ needs.linux-packages.result }}" "$PACKAGING"
          controle linux-rpm-aarch64 "${{ needs.linux-rpm-aarch64.result }}" "$PACKAGING"

  linux-package-signing:
    name: Signer les paquets Linux publiables
    needs: [version, ci-ok, linux-packages]
    if: github.event_name != 'pull_request' && contains(fromJSON('["stable","beta","canary"]'), needs.version.outputs.channel)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bobine-linux-packages-*
          merge-multiple: true
          path: package-assets
      - name: Installer les outils de signature
        run: sudo apt-get $APT_OPTIONS update && sudo apt-get $APT_OPTIONS install -y rpm gnupg
      - name: Importer la clé et signer
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          GNUPGHOME: ${{ runner.temp }}/bobine-signing
        run: |
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          bash scripts/ci/sign-linux-packages.sh package-assets
          gpg --batch --armor --export B77D96D72F84F36ACAA3F8729CBF497D829EE15A > package-assets/bobine.gpg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 3 }}
          name: bobine-linux-packages-signed
          path: package-assets/
          if-no-files-found: error
      - name: Retirer la clé privée du runner
        if: always()
        env:
          GNUPGHOME: ${{ runner.temp }}/bobine-signing
        run: |
          gpgconf --kill gpg-agent || true
          rm -rf "$GNUPGHOME"

  release-stable:
    name: Publish Stable Release
    needs: [version, ci-ok, backend, backend-android-compat, android-startup, frontend, windows-build, windows-build-arm64, linux-deb, macos-build, android-build, linux-packages, linux-package-signing]
    if: needs.version.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .workflow-tools
      - name: Assembler les assets de la release
        uses: ./.workflow-tools/.github/actions/assemble-release-assets
        with:
          suffix: ${{ needs.version.outputs.filename_version }}
          winget-tag: ${{ needs.version.outputs.tag_name }}
          signing-key: ${{ secrets.APT_GPG_PRIVATE_KEY }}
      - name: Select Release Notes Body
        id: release-notes
        run: |
          TAG="${{ needs.version.outputs.tag_name }}"
          if [ ! -f "docs/releases/${TAG}.md" ]; then
            echo "::error::docs/releases/${TAG}.md est introuvable — écrire les notes de version avant de publier le tag ${TAG}."
            exit 1
          fi
          echo "body_path=docs/releases/${TAG}.md" >> "$GITHUB_OUTPUT"
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: release-assets/*
          tag_name: ${{ needs.version.outputs.tag_name }}
          name: Bobine ${{ needs.version.outputs.tag_name }}
          body_path: ${{ steps.release-notes.outputs.body_path }}
          draft: false
          prerelease: false
          generate_release_notes: false

  release-canary:
    name: Publish/Update Canary Release
    needs: [version, ci-ok, backend, backend-android-compat, android-startup, frontend, firefox-smoke, install-script, windows-build, windows-build-arm64, linux-deb, macos-build, android-build, linux-packages, linux-package-signing]
    if: needs.version.outputs.channel == 'canary'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: publish-canary-release
      cancel-in-progress: false
    outputs:
      published: ${{ steps.rolling.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Assembler les assets de la release
        uses: ./.github/actions/assemble-release-assets
        with:
          suffix: canary
          signing-key: ${{ secrets.APT_GPG_PRIVATE_KEY }}
      - name: Publier la release canary
        id: rolling
        uses: ./.github/actions/publish-rolling-release
        with:
          channel: canary
          title: "Bobine — Canary (build automatique)"
          commit-short: ${{ needs.version.outputs.commit_short }}
          base-version: ${{ needs.version.outputs.base_version }}
          require-tip: 'true'
          token: ${{ github.token }}

  release-beta:
    name: Publish/Update Beta Release
    needs: [version, ci-ok, backend, backend-android-compat, android-startup, frontend, windows-build, windows-build-arm64, linux-deb, macos-build, android-build, linux-packages, linux-package-signing]
    if: needs.version.outputs.channel == 'beta'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: publish-beta-release
      cancel-in-progress: false
    outputs:
      published: ${{ steps.rolling.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Assembler les assets de la release
        uses: ./.github/actions/assemble-release-assets
        with:
          suffix: beta
          signing-key: ${{ secrets.APT_GPG_PRIVATE_KEY }}
      - name: Publier la release beta
        id: rolling
        uses: ./.github/actions/publish-rolling-release
        with:
          channel: beta
          title: "Bobine — Bêta (lot curé)"
          commit-short: ${{ needs.version.outputs.commit_short }}
          base-version: ${{ needs.version.outputs.base_version }}
          require-tip: 'false'
          token: ${{ github.token }}

  publish-linux-packages:
    name: Publier les dépôts Linux (packages.bobine.fit)
    needs: [version, linux-deb, linux-package-signing, release-stable, release-beta, release-canary]
    if: |
      always() && !cancelled() && needs.linux-package-signing.result == 'success' &&
      (needs.release-stable.result == 'success' ||
       (needs.release-beta.result == 'success' && needs.release-beta.outputs.published == 'true') ||
       (needs.release-canary.result == 'success' && needs.release-canary.outputs.published == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish-linux-packages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FantasmaGlad/bobine-packages
          ref: gh-pages
          path: package-repo
          ssh-key: ${{ secrets.PACKAGES_DEPLOY_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FantasmaGlad/BobineWeb
          ref: 9051a451b39639c875fa5cc84897e79f7639d278
          path: package-verification
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobine-linux-packages-signed
          path: package-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobine-linux-deb
          path: package-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobine-linux-deb-arm64
          path: package-assets
      - name: Installer les outils de dépôt
        run: |
          sudo apt-get $APT_OPTIONS update
          sudo apt-get $APT_OPTIONS install -y reprepro rpm gnupg createrepo-c
          . scripts/ci/container-images.sh
          docker pull "$ARCH_IMAGE"
      - name: Paquets de Bobine Deploy (dernière release signée)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p deploy-assets
          if ! gh release download --repo FantasmaGlad/bobine-deploy --dir deploy-assets \
               --pattern 'bobine-deploy_*.deb' --pattern 'bobine-deploy-*.rpm' --pattern 'SHA256SUMS' --pattern 'SHA256SUMS.asc'; then
            echo "::warning::release de Bobine Deploy illisible : paquets déjà publiés conservés"; rm -rf deploy-assets/*; exit 0
          fi
          gpg --no-default-keyring --keyring "$RUNNER_TEMP/deploy.kbx" --import package-assets/bobine.gpg
          gpg --no-default-keyring --keyring "$RUNNER_TEMP/deploy.kbx" --verify deploy-assets/SHA256SUMS.asc deploy-assets/SHA256SUMS
          (cd deploy-assets && sha256sum --check --ignore-missing --strict SHA256SUMS)
          rm deploy-assets/SHA256SUMS deploy-assets/SHA256SUMS.asc
          ls -l deploy-assets
      - name: Préparer et vérifier les dépôts signés (Debian, RPM et Arch)
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          GNUPGHOME: ${{ runner.temp }}/bobine-signing
          BOBINE_RPMDB: ${{ runner.temp }}/bobine-rpmdb
          CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          mkdir -p "$BOBINE_RPMDB"
          rpmkeys --dbpath "$BOBINE_RPMDB" --import package-assets/bobine.gpg
          bash scripts/ci/prepare-package-repository.sh deb "$CHANNEL" package-assets package-repo deploy-assets
          bash scripts/ci/prepare-package-repository.sh rpm "$CHANNEL" package-assets package-repo deploy-assets
          bash scripts/ci/prepare-package-repository.sh arch "$CHANNEL" package-assets package-repo
      - name: Vérifier toute la chaîne APT, DNF et Pacman avant publication
        run: |
          sudo chown -R "$(id -u):$(id -g)" package-repo
          python3 package-verification/deploy/onion/verify-packages.py package-repo
          python3 package-verification/deploy/onion/test-verify-packages.py package-repo
          size=$(du -sb --exclude=.git package-repo | cut -f1)
          echo "Taille du site de paquets : $size octets"
          test "$size" -lt 950000000
      - name: Publier sur gh-pages sans écraser les pages vitrines
        env:
          CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          bash scripts/ci/commit-package-repository.sh package-repo "chore(packages): actualiser les depots debian, fedora et arch ($CHANNEL)"
      - name: Retirer la clé privée du runner
        if: always()
        env:
          GNUPGHOME: ${{ runner.temp }}/bobine-signing
        run: |
          gpgconf --kill gpg-agent || true
          rm -rf "$GNUPGHOME"

  notify-web-release:
    name: Notifier le miroir web après publication
    needs: [version, publish-linux-packages]
    if: ${{ always() && !cancelled() && needs.publish-linux-packages.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Envoyer bobine-release à BobineWeb
        env:
          BOBINE_WEB_DISPATCH_TOKEN: ${{ secrets.BOBINE_WEB_DISPATCH_TOKEN }}
          RELEASE_CHANNEL: ${{ needs.version.outputs.channel }}
        run: RELEASE_SHA="$(git rev-parse HEAD)" bash scripts/ci/notify-web-release.sh
