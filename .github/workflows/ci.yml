      - name: Lancer le backend installé et sonder /api/health
        shell: pwsh
        run: scripts/ci/smoke-windows-backend.ps1 -Exe "$env:RUNNER_TEMP\bobine-installed\BobineBackend.exe" -LogDir "$env:RUNNER_TEMP\bobine-installer-logs" -DataRoot "$env:RUNNER_TEMP\bobine-installed-data"
      - name: Désinstaller en silence et vérifier le retrait
        shell: pwsh
        run: scripts/ci/smoke-windows-installer.ps1 -Action Uninstall -InstallDir "$env:RUNNER_TEMP\bobine-installed" -LogDir "$env:RUNNER_TEMP\bobine-installer-logs"
      - name: Journaux de l'installeur et du backend installé
        if: failure()
        shell: pwsh
        run: scripts/ci/smoke-windows-installer.ps1 -Action Logs -InstallDir "$env:RUNNER_TEMP\bobine-installed" -LogDir "$env:RUNNER_TEMP\bobine-installer-logs"

  linux-deb:
    # Paquet APT (.deb) Linux non-headless, amd64 et arm64 : un seul job à matrice, les deux architectures suivent exactement les mêmes étapes.
    # Les paquets DNF et pacman en sont dérivés par le job linux-packages.
    # Construit le frontend Next.js, les exécutables PyInstaller Linux
    # (BobineBackend + BobineTray), assemble l'arborescence Debian et valide
    # l'intégrité et l'installation réelle du paquet .deb sur un runner de l'architecture visée.
    name: Paquet APT (.deb ${{ matrix.deb_arch }})
    runs-on: ${{ matrix.runner }}
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - deb_arch: amd64
            runner: ubuntu-latest
            artifact: bobine-linux-deb
          - deb_arch: arm64
            runner: ubuntu-24.04-arm
            artifact: bobine-linux-deb-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # À placer avant toute étape pip : pip lance `rustc --version` (délai de 0,5 s) pour son User-Agent.
      # Avec rust-toolchain.toml et sans toolchain installée, le proxy rustup commence à l'installer et pip
      # le tue en plein vol ; le premier cargo trouve alors une toolchain partielle (« recovering from a
      # partially installed toolchain », parfois « detected conflict: 'bin/cargo-clippy' »).
      - name: Installer la toolchain Rust (avant pip)
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build du frontend (export statique)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints-desktop.txt
      - name: Installer les dépendances Python + PyInstaller
        run: |
          python -m pip install pip==26.2.2
          python -m pip install -r backend/requirements.txt
          python -m pip install -r backend/requirements-build.txt
          python -m pip check
      - name: Identifiants de build (VERSION bundlée + COMMIT)
        run: |
          echo "${{ needs.version.outputs.commit_short }}" > COMMIT
          if [ "${{ needs.version.outputs.channel }}" = "beta" ] || [ "${{ needs.version.outputs.channel }}" = "canary" ]; then
            echo "${{ needs.version.outputs.display_version }}" > VERSION
          fi
      - name: Compiler et contrôler le composant audio natif (bobine-media)
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "60"
        run: |
          mkdir -p "$RUNNER_TEMP/media-stage"
          python3 scripts/ci/stage-media.py --dest "$RUNNER_TEMP/media-stage"
      - name: Construire le paquet Debian (.deb)
        env:
          VERSION: ${{ needs.version.outputs.deb_version }}
          DEB_FILENAME_VERSION: ${{ needs.version.outputs.filename_version }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends patchelf
          ./packaging/linux/build_deb.sh
      - name: Valider les métadonnées d'application (AppStream, .desktop)
        if: matrix.deb_arch == 'amd64'
        run: |
          sudo apt-get install -y --no-install-recommends appstream desktop-file-utils
          appstreamcli validate --pedantic --no-net packaging/linux/bobine.metainfo.xml
          desktop-file-validate packaging/linux/bobine.desktop
      - name: Inspecter et valider la structure du paquet .deb
        run: |
          dpkg-deb -I dist-deb/bobine_*_${{ matrix.deb_arch }}.deb
          dpkg-deb -c dist-deb/bobine_*_${{ matrix.deb_arch }}.deb
      - name: Tester l'installation réelle (${{ matrix.runner }})
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist-deb/bobine_*_${{ matrix.deb_arch }}.deb
          test -x /usr/bin/bobine
          test -f /usr/share/applications/com.bobine.app.desktop
          test -f /usr/share/metainfo/com.bobine.app.metainfo.xml
          test -f /usr/lib/systemd/user/bobine.service
          test -x /usr/lib/bobine/BobineBackend
          test -x /usr/lib/bobine/BobineTray
          test -x /usr/lib/bobine/bobine-media
          python3 scripts/ci/stage-media.py --check /usr/lib/bobine/bobine-media
          test -f /usr/share/icons/hicolor/256x256/apps/bobine.png
          test -f /usr/share/pixmaps/bobine.png
      - name: Lancer l'application installée (BobineBackend, /api/health)
        run: bash scripts/ci/smoke-installed-backend.sh
      - name: Vérifier que apt refuse le paquet sur Debian 12 et Ubuntu 22.04 (plancher glibc)
        run: bash scripts/ci/test-glibc-floor.sh deb dist-deb/bobine_*_${{ matrix.deb_arch }}.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist-deb/bobine_*_${{ matrix.deb_arch }}.deb
          if-no-files-found: error

  macos-build:
    # PyInstaller ne cross-compile pas — ce
    # job est le seul endroit où le packaging macOS (bobine.spec, BUNDLE())
    # est réellement construit sur un vrai macOS. Écrit d'après la
    # documentation officielle PyInstaller/Apple (aucune machine macOS dans
    # l'environnement de développement) — jamais exécuté tel quel avant son
    # premier passage ici, à surveiller de près.
    # `macos-latest` est arm64 uniquement depuis macOS 14 (pas de x86_64 par
    # défaut) : l'étape de signature ad-hoc est OBLIGATOIRE sur ce runner —
    # sans elle, le noyau (AMFI) tue au lancement tout binaire/bibliothèque
    # figé non signé sur Apple Silicon ("Killed: 9"), indépendamment de tout
    # avertissement Gatekeeper.
    name: macOS packaging (PyInstaller + dmg)
    runs-on: macos-latest
    needs: [version]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Avant toute étape pip : pip lance `rustc --version` (délai de 0,5 s) et interrompt l'installation implicite de la toolchain.
      - name: Installer la toolchain Rust (avant pip)
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build du frontend (export statique)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints-desktop.txt
      - name: Installer les dépendances Python + PyInstaller
        run: |
          python -m pip install pip==26.2.2
          python -m pip install -r backend/requirements.txt
          python -m pip install -r backend/requirements-build.txt
          python -m pip check
      - name: Identifiants de build (VERSION bundlée + COMMIT)
        run: |
          echo "${{ needs.version.outputs.commit_short }}" > COMMIT
          if [ "${{ needs.version.outputs.channel }}" = "beta" ] || [ "${{ needs.version.outputs.channel }}" = "canary" ]; then
            echo "${{ needs.version.outputs.display_version }}" > VERSION
          fi
      - name: Construire Bobine.app
        working-directory: backend
        run: pyinstaller ../packaging/macos/bobine.spec
      # Fenêtre native du projecteur : tests puis binaire
      # release, copié dans le bundle AVANT la signature ad-hoc ci-dessous.
      - name: Tester et construire la fenêtre native du projecteur
        working-directory: projector
        # Nouvelles tentatives réseau : le téléchargement de l'index crates.io a
        # déjà échoué une fois sur une panne DNS passagère du runner. `--locked`
        # impose Cargo.lock (build reproductible).
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "60"
        run: |
          cargo test --locked
          cargo build --release --locked
          cp target/release/bobine-projector ../backend/dist/Bobine.app/Contents/MacOS/bobine-projector
      - name: Tester et construire le sidecar des périphériques
        working-directory: devices
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "60"
        run: |
          cargo test --locked
          cargo build --release --locked
          cp target/release/bobine-devices ../backend/dist/Bobine.app/Contents/MacOS/bobine-devices
      - name: Compiler et embarquer le composant audio natif
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "60"
        run: python3 scripts/ci/stage-media.py --dest backend/dist/Bobine.app/Contents/MacOS
      - name: Vérifier la présence de l'icône dans le bundle
        run: test -f backend/dist/Bobine.app/Contents/Resources/bobine.icns
      - name: Signature ad-hoc (requise par le noyau sur Apple Silicon)
        run: codesign --force --deep -s - backend/dist/Bobine.app
      - name: Vérifier que BobineBackend démarre et répond à /api/health
        # Journaux et données hors du bundle : le dmg embarque Bobine.app, déjà signé.
        run: scripts/ci/smoke-macos-backend.sh backend/dist/Bobine.app/Contents/MacOS/BobineBackend --home "$RUNNER_TEMP/bobine-dist-home" --log-dir "$RUNNER_TEMP/bobine-dist-logs"
      - name: Créer le .dmg (hdiutil)
        env:
          DMG_FILENAME_VERSION: ${{ needs.version.outputs.filename_version }}
        run: |
          mkdir -p dmg-root dist-dmg
          cp -R backend/dist/Bobine.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Bobine" -srcfolder dmg-root -ov -format UDZO "dist-dmg/Bobine-${DMG_FILENAME_VERSION}.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bobine-macos-dmg
          path: dist-dmg/*.dmg
      # Montage réel du dmg : copie de Bobine.app, signature du bundle copié, lancement de son backend, démontage.
      - name: Monter le .dmg, copier Bobine.app et lancer son backend
        env:
          DMG_FILENAME_VERSION: ${{ needs.version.outputs.filename_version }}
        run: scripts/ci/smoke-macos-dmg.sh "dist-dmg/Bobine-${DMG_FILENAME_VERSION}.dmg" "$RUNNER_TEMP/bobine-dmg"

  # Publie une release STABLE — un tag Vx.y.z par version, historique normal
  # et attendu sur la page GitHub Releases.
  # Statut unique à exiger dans la protection de la branche main : vert seulement si tous les
  # contrôles de validation (hors publication) sont verts.
  linux-packages:
    name: Paquets DNF et pacman (${{ matrix.arch }})
    needs: [version, linux-deb]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            artifact: bobine-linux-deb
          - arch: aarch64
            artifact: bobine-linux-deb-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: deb-input
      - name: Outils de contrôle des archives
        run: sudo apt-get update && sudo apt-get install -y rpm zstd
      - name: Construire et vérifier les paquets
        env:
          FILENAME_VERSION: ${{ needs.version.outputs.filename_version }}
        run: |
          deb="$(find deb-input -name '*.deb' | head -1)"
          bash scripts/ci/build-linux-packages.sh "$deb" '${{ matrix.arch }}'
          bash scripts/ci/check-package-parity.sh "$deb" "$(find dist-rpm -name '*.rpm' | head -1)" "$(find dist-arch -name '*.pkg.tar.zst' | head -1)"
      # x86_64 : build-linux-packages.sh a installé et lancé le rpm (Fedora) et le paquet Arch ; l'aarch64 l'est par linux-rpm-aarch64.
      - name: Vérifier que dnf refuse le rpm sur AlmaLinux 9 (plancher glibc)
        if: matrix.arch == 'x86_64'
        run: bash scripts/ci/test-glibc-floor.sh rpm "$(find dist-rpm -name '*.x86_64.rpm' | head -1)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bobine-linux-packages-${{ matrix.arch }}
          path: |
            dist-rpm/*.rpm
            dist-arch/*.pkg.tar.zst

  linux-rpm-aarch64:
    # Le rpm aarch64 est construit sur ubuntu-latest (l'image Arch officielle n'existe qu'en x86_64) puis installé et lancé ici,
    # dans un conteneur Fedora arm64 sur un runner arm64. Le paquet Arch aarch64 reste sans installation (voir container-images.sh).
    name: Paquet DNF aarch64 installé et lancé (Fedora arm64)
    needs: [linux-packages]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobine-linux-packages-aarch64
          path: rpm-input
      - name: Installer et lancer le rpm dans Fedora arm64
        run: |
          . scripts/ci/container-images.sh
          rpm="$(find rpm-input -name '*.aarch64.rpm' | head -1)"
          test -n "$rpm"
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/$(dirname "$rpm"):/pkg:ro" "$FEDORA_IMAGE" \
            bash -c 'test "$(uname -m)" = aarch64 && dnf -y -q install desktop-file-utils && /src/packaging/rpm/test_rpm.sh "$1"' -- "/pkg/$(basename "$rpm")"
      - name: Vérifier que dnf refuse le rpm sur AlmaLinux 9 arm64 (plancher glibc)
        run: bash scripts/ci/test-glibc-floor.sh rpm "$(find rpm-input -name '*.aarch64.rpm' | head -1)"

  ci-ok:
    name: ci-ok
    if: always()
    needs: [version, frontend, firefox-smoke, backend, backend-android-compat, android-startup, devices-sidecar, media-component, assistant-core, assistant-core-arm64, android-build, install-script, windows-build, windows-build-arm64, linux-deb, macos-build, linux-packages, linux-rpm-aarch64]
    runs-on: ubuntu-latest
    steps:
      - name: Tous les contrôles sont verts
        run: |
          set -eu
          results='${{ join(needs.*.result, ' ') }}'
          echo "résultats : $results"
          for r in $results; do
            [ "$r" = "success" ] || { echo "::error::un contrôle a échoué ou a été ignoré ($r)"; exit 1; }
          done

  linux-package-signing:
    name: Signer les paquets Linux publiables
    needs: [version, ci-ok, linux-packages]
    if: github.event_name != 'pull_request' && contains(fromJSON('["stable","beta","canary"]'), needs.version.outputs.channel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bobine-linux-packages-*
          merge-multiple: true
          path: package-assets
      - name: Installer les outils de signature
        run: sudo apt-get update && sudo apt-get install -y rpm gnupg
      - name: Importer la clé et signer
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          GNUPGHOME: ${{ runner.temp }}/bobine-signing
        run: |
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          bash scripts/ci/sign-linux-packages.sh package-assets
          gpg --batch --armor --export B77D96D72F84F36ACAA3F8729CBF497D829EE15A > package-assets/bobine.gpg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bobine-linux-packages-signed
          path: package-assets/
      - name: Retirer la clé privée du runner
        if: always()
        env:
          GNUPGHOME: ${{ runner.temp }}/bobine-signing
        run: |
          gpgconf --kill gpg-agent || true
          rm -rf "$GNUPGHOME"

  release-stable:
    name: Publish Stable Release
    needs: [version, backend, backend-android-compat, android-startup, frontend, windows-build, windows-build-arm64, linux-deb, macos-build, assistant-core, assistant-core-arm64, android-build, linux-packages, linux-package-signing]
    if: needs.version.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create release assets directory
        run: mkdir -p release-assets
      - name: Download Windows installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobine-windows-installer
          path: release-assets
      - name: Download Windows ARM64 installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobine-windows-installer-arm64
          path: release-assets
      - name: Download Linux deb
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobine-linux-deb
          path: release-assets
      - name: Download Linux ARM64 deb
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobine-linux-deb-arm64
          path: release-assets
      - name: Download macOS dmg
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobine-macos-dmg
          path: release-assets
      - name: Download Linux assistant binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobine-assistant-linux
          path: release-assets
      - name: Download Linux ARM64 assistant binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobine-assistant-linux-arm64
          path: release-assets
      - name: Download Android APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: bobine-android-apk
          path: android-artifact
      - name: Download Android TV APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: bobine-android-tv-apk
          path: android-tv-artifact
      - name: Prepare Android APK assets
        run: |
          if [ -d "android-artifact" ] && compgen -G "android-artifact/*.apk" > /dev/null; then
            APK_SRC=$(ls android-artifact/*.apk | head -1)
            cp "$APK_SRC" "release-assets/Bobine-${{ needs.version.outputs.filename_version }}.apk"
            echo "Android APK copié : release-assets/Bobine-${{ needs.version.outputs.filename_version }}.apk"
          else
            echo "Aucun APK Android trouvé dans l'artefact."
          fi
          if [ -d "android-tv-artifact" ] && compgen -G "android-tv-artifact/*.apk" > /dev/null; then
            APK_TV_SRC=$(ls android-tv-artifact/*.apk | head -1)
            cp "$APK_TV_SRC" "release-assets/Bobine-TV-${{ needs.version.outputs.filename_version }}.apk"
            echo "Android TV APK copié : release-assets/Bobine-TV-${{ needs.version.outputs.filename_version }}.apk"
          else
            echo "Aucun APK Android TV trouvé dans l'artefact."
          fi
      - name: Télécharger les paquets Fedora et Arch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobine-linux-packages-signed
          path: package-assets
      - name: Rassembler les paquets Linux
        run: find package-assets -type f \( -name '*.rpm' -o -name '*.pkg.tar.zst' -o -name '*.pkg.tar.zst.sig' \) -exec cp {} release-assets/ \;
      - name: Copy install script into release assets
        run: cp install.sh release-assets/
      - name: Signer la liste des empreintes (SHA256SUMS)
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          GNUPGHOME: ${{ runner.temp }}/bobine-signing
        run: |
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          bash scripts/ci/sign-release-checksums.sh release-assets
      - name: Retirer la clé privée du runner
        if: always()
        env:
          GNUPGHOME: ${{ runner.temp }}/bobine-signing
        run: |
          gpgconf --kill gpg-agent || true
          rm -rf "$GNUPGHOME"
      - name: Vérifier la complétude des assets
        run: scripts/ci/verify-release-assets.sh release-assets "${{ needs.version.outputs.filename_version }}"
      - name: Inspect generated binary assets
        run: ls -lh release-assets/
      - name: Select Release Notes Body
        id: release-notes
        run: |
          TAG="${{ needs.version.outputs.tag_name }}"
          if [ ! -f "docs/releases/${TAG}.md" ]; then
            echo "::error::docs/releases/${TAG}.md est introuvable — écrire les notes de version avant de publier le tag ${TAG}."
            exit 1
          fi
          echo "body_path=docs/releases/${TAG}.md" >> "$GITHUB_OUTPUT"
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release-assets/*
          tag_name: ${{ needs.version.outputs.tag_name }}
          name: Bobine ${{ needs.version.outputs.tag_name }}
          body_path: ${{ steps.release-notes.outputs.body_path }}
          draft: false
          prerelease: false
          generate_release_notes: false

  # Publie/rafraîchit la release CANARY — un seul tag mobile "canary",
  # republié en place à chaque déclenchement (automatique à chaque push sur
  # main, ou manuel). Le tag est force-déplacé sur le commit courant ; les
  # notes sont générées automatiquement (changelog depuis la dernière
  # Stable), pas de fichier docs/releases/ à maintenir pour ce canal (il
  # serait obsolète dès le commit suivant). Zéro curation : dernier commit
  # de main, sans validation matérielle manuelle.
  release-canary:
    name: Publish/Update Canary Release
    needs: [version, backend, backend-android-compat, android-startup, frontend, firefox-smoke, install-script, windows-build, windows-build-arm64, linux-deb, macos-build, assistant-core, assistant-core-arm64, android-build, linux-packages, linux-package-signing]
    if: needs.version.outputs.channel == 'canary'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create release assets directory
        run: mkdir -p release-assets
      - name: Download Windows installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobine-windows-installer
          path: release-assets
      - name: Download Windows ARM64 installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobine-windows-installer-arm64
          path: release-assets
      - name: Download Linux deb
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobine-linux-deb
          path: release-assets
      - name: Download Linux ARM64 deb
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobine-linux-deb-arm64
          path: release-assets
      - name: Download macOS dmg
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobine-macos-dmg
          path: release-assets
      - name: Download Linux assistant binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobine-assistant-linux
          path: release-assets
      - name: Download Linux ARM64 assistant binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobine-assistant-linux-arm64
          path: release-assets
      - name: Download Android APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: bobine-android-apk
          path: android-artifact
      - name: Download Android TV APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: bobine-android-tv-apk
          path: android-tv-artifact
      - name: Prepare Android APK assets
        run: |
          if [ -d "android-artifact" ] && compgen -G "android-artifact/*.apk" > /dev/null; then
            APK_SRC=$(ls android-artifact/*.apk | head -1)
            cp "$APK_SRC" "release-assets/Bobine-canary.apk"
            echo "Android APK copié : release-assets/Bobine-canary.apk"
          else
            echo "Aucun APK Android trouvé dans l'artefact."
          fi
          if [ -d "android-tv-artifact" ] && compgen -G "android-tv-artifact/*.apk" > /dev/null; then
            APK_TV_SRC=$(ls android-tv-artifact/*.apk | head -1)
            cp "$APK_TV_SRC" "release-assets/Bobine-TV-canary.apk"
            echo "Android TV APK copié : release-assets/Bobine-TV-canary.apk"
          else
            echo "Aucun APK Android TV trouvé dans l'artefact."
          fi
      - name: Télécharger les paquets Fedora et Arch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobine-linux-packages-signed
          path: package-assets
      - name: Rassembler les paquets Linux
        run: find package-assets -type f \( -name '*.rpm' -o -name '*.pkg.tar.zst' -o -name '*.pkg.tar.zst.sig' \) -exec cp {} release-assets/ \;
      - name: Copy install script into release assets
        run: cp install.sh release-assets/
      - name: Signer la liste des empreintes (SHA256SUMS)
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          GNUPGHOME: ${{ runner.temp }}/bobine-signing
        run: |
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          bash scripts/ci/sign-release-checksums.sh release-assets
      - name: Retirer la clé privée du runner
        if: always()
        env:
          GNUPGHOME: ${{ runner.temp }}/bobine-signing
        run: |
          gpgconf --kill gpg-agent || true
          rm -rf "$GNUPGHOME"
      - name: Vérifier la complétude des assets
        run: scripts/ci/verify-release-assets.sh release-assets canary
      - name: Inspect generated binary assets
        run: ls -lh release-assets/
      - name: Force-move the "canary" tag to the current commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f canary "${{ github.sha }}"
          git push origin canary --force
      - name: Generate rolling release notes (README-style layout + changelog since last Stable)
        id: notes
        run: |
          # Bloc statique (bannière + intro + tableau de téléchargement) dans un
          # heredoc ENTIÈREMENT quoté ('NOTES_EOF') : aucune substitution shell,
          # donc tous les backticks/`$`/badges markdown restent littéraux sans
          # avoir besoin d'être échappés un par un. __COMMIT__/__VERSION__ sont
          # remplacés juste après par sed (valeurs courtes, sans caractère
          # spécial pour sed : un SHA court et un "x.y.z"). Chaque ligne du
          # heredoc est indentée pour respecter le bloc scalaire YAML `run: |`
          # (l'indentation commune est retirée par le parseur YAML avant que
          # bash ne voie le script — le fichier markdown généré, lui, n'a
          # bien AUCUNE indentation, sans quoi Markdown le lirait comme un
          # bloc de code).
          cat > /tmp/canary-notes.md <<'NOTES_EOF'
          <p align="center">
            <img alt="Bobine" src="https://raw.githubusercontent.com/FantasmaGlad/Bobine/main/Assets/Images/LogoBanniere.png" width="100%">
          </p>

          <p align="center">
            <img alt="Bobine — Canal Canary" src="https://raw.githubusercontent.com/FantasmaGlad/Bobine/main/Assets/Images/Versions/Canary.png" width="220">
          </p>

          # Bobine — Canary (build automatique)

          > **Canal Canary (rolling).** Pre-release construite automatiquement depuis le tout dernier commit de `main`, sans aucune curation — pour les développeurs et utilisateurs avancés souhaitant suivre le développement au jour le jour. Une version stable équivalente ou plus récente la remplace toujours automatiquement.

          Pre-release construite depuis le tout dernier commit de `main`, sans aucune curation — reconstruite automatiquement à chaque push et republiée **en place** sur ce même tag mobile `canary` (jamais un nouveau tag par itération). Une version stable équivalente ou plus récente la remplace toujours automatiquement.

          Réservée aux utilisateurs ayant activé le canal Canary (Réglages → Mises à jour, `install.sh --channel=canary`, ou l'assistant Tauri). Pour un accès anticipé moins volatil, voir le [canal Bêta](https://github.com/FantasmaGlad/Bobine/releases/tag/beta) (lots curés, publication manuelle).

          **Basé sur** commit `__COMMIT__` · version à venir `__VERSION__`

          Le lot d’optimisation 5.0.3 est inclus. Les essais sur les appareils restent nécessaires avant sa promotion Stable.

          ---

          NOTES_EOF
          sed -i "s/__COMMIT__/${{ needs.version.outputs.commit_short }}/; s/__VERSION__/${{ needs.version.outputs.base_version }}/" /tmp/canary-notes.md
          python3 scripts/ci/render-rolling-notes.py canary >> /tmp/canary-notes.md

          # Bloc dynamique (changelog) ajouté à part, pas via sed : un message
          # de commit peut contenir '/', '&' ou d'autres caractères qui
          # casseraient une substitution sed, et un fence de code (```) rend le
          # changelog bien plus lisible qu'un paragraphe brut (le Markdown
          # fusionne des lignes consécutives sans ligne vide entre elles).
          LAST_STABLE="$(git tag --list 'V*' --sort=-v:refname | grep -E '^V[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          if [ -n "${LAST_STABLE}" ]; then
            CHANGELOG_HEADING="Changements depuis ${LAST_STABLE}"
            CHANGELOG="$(git log "${LAST_STABLE}..HEAD" --oneline --no-merges | head -50)"
          else
            CHANGELOG_HEADING="Changements récents"
            CHANGELOG="$(git log --oneline --no-merges | head -50)"
          fi
          {
            echo "---"
            echo ""
            echo "## ${CHANGELOG_HEADING}"
            echo ""
            echo '```'
            echo "${CHANGELOG}"
            echo '```'
            echo ""
            echo "---"
            echo ""
            echo "Retour à la Stable à tout moment, sans perte de données : Réglages → Mises à jour logicielles → Canal de mise à jour → Stable."
          } >> /tmp/canary-notes.md
          echo "notes_path=/tmp/canary-notes.md" >> "$GITHUB_OUTPUT"
      - name: Delete previous Canary release (assets get fully replaced, not merged)
        run: gh release delete canary --yes || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish Canary release
        run: |
          gh release create canary release-assets/* \
            --title "Bobine — Canary (build automatique)" \
            --notes-file "${{ steps.notes.outputs.notes_path }}" \
            --prerelease \
            --target "${{ github.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}

  # Publie/rafraîchit la release BÊTA (palier curé) — un seul tag mobile
  # "beta", republié en place UNIQUEMENT sur déclenchement manuel
  # (workflow_dispatch, jamais sur un simple push sur main — à la différence
  # de Canary). Le mainteneur choisit la référence ("Use workflow from")
  # quand un lot de fonctionnalités/correctifs est prêt à être partagé plus
  # largement que sur Canary. Même mécanique de tag mobile et de notes
  # générées automatiquement que Canary, juste un déclenchement différent.
  release-beta:
    name: Publish/Update Beta Release
    needs: [version, backend, backend-android-compat, android-startup, frontend, windows-build, windows-build-arm64, linux-deb, macos-build, assistant-core, assistant-core-arm64, android-build, linux-packages, linux-package-signing]
    if: needs.version.outputs.channel == 'beta'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create release assets directory
        run: mkdir -p release-assets
      - name: Download Windows installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobine-windows-installer
          path: release-assets
      - name: Download Windows ARM64 installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobine-windows-installer-arm64
          path: release-assets
      - name: Download Linux deb
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobine-linux-deb
          path: release-assets
      - name: Download Linux ARM64 deb
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobine-linux-deb-arm64
          path: release-assets
      - name: Download macOS dmg
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobine-macos-dmg
          path: release-assets
      - name: Download Linux assistant binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobine-assistant-linux
          path: release-assets
      - name: Download Linux ARM64 assistant binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobine-assistant-linux-arm64
          path: release-assets
      - name: Download Android APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: bobine-android-apk
          path: android-artifact
      - name: Download Android TV APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: bobine-android-tv-apk
          path: android-tv-artifact
      - name: Prepare Android APK assets
        run: |
          if [ -d "android-artifact" ] && compgen -G "android-artifact/*.apk" > /dev/null; then
            APK_SRC=$(ls android-artifact/*.apk | head -1)
            cp "$APK_SRC" "release-assets/Bobine-beta.apk"
            echo "Android APK copié : release-assets/Bobine-beta.apk"
          else
            echo "Aucun APK Android trouvé dans l'artefact."
          fi
          if [ -d "android-tv-artifact" ] && compgen -G "android-tv-artifact/*.apk" > /dev/null; then
            APK_TV_SRC=$(ls android-tv-artifact/*.apk | head -1)
            cp "$APK_TV_SRC" "release-assets/Bobine-TV-beta.apk"
            echo "Android TV APK copié : release-assets/Bobine-TV-beta.apk"
          else
            echo "Aucun APK Android TV trouvé dans l'artefact."
          fi
      - name: Télécharger les paquets Fedora et Arch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobine-linux-packages-signed
          path: package-assets
      - name: Rassembler les paquets Linux
        run: find package-assets -type f \( -name '*.rpm' -o -name '*.pkg.tar.zst' -o -name '*.pkg.tar.zst.sig' \) -exec cp {} release-assets/ \;
      - name: Copy install script into release assets
        run: cp install.sh release-assets/
      - name: Signer la liste des empreintes (SHA256SUMS)
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          GNUPGHOME: ${{ runner.temp }}/bobine-signing
        run: |
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          bash scripts/ci/sign-release-checksums.sh release-assets
      - name: Retirer la clé privée du runner
        if: always()
        env:
          GNUPGHOME: ${{ runner.temp }}/bobine-signing
        run: |
          gpgconf --kill gpg-agent || true
          rm -rf "$GNUPGHOME"
      - name: Vérifier la complétude des assets
        run: scripts/ci/verify-release-assets.sh release-assets beta
      - name: Inspect generated binary assets
        run: ls -lh release-assets/
      - name: Force-move the "beta" tag to the current commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f beta "${{ github.sha }}"
          git push origin beta --force
      - name: Generate rolling release notes (README-style layout + changelog since last Stable)
        id: notes
        run: |
          # Bloc statique (bannière + intro + tableau de téléchargement) dans un
          # heredoc ENTIÈREMENT quoté ('NOTES_EOF') : aucune substitution shell,
          # donc tous les backticks/`$`/badges markdown restent littéraux sans
          # avoir besoin d'être échappés un par un. __COMMIT__/__VERSION__ sont
          # remplacés juste après par sed (valeurs courtes, sans caractère
          # spécial pour sed : un SHA court et un "x.y.z"). Chaque ligne du
          # heredoc est indentée pour respecter le bloc scalaire YAML `run: |`
          # (l'indentation commune est retirée par le parseur YAML avant que
          # bash ne voie le script — le fichier markdown généré, lui, n'a
          # bien AUCUNE indentation, sans quoi Markdown le lirait comme un
          # bloc de code).
          cat > /tmp/beta-notes.md <<'NOTES_EOF'
          <p align="center">
            <img alt="Bobine" src="https://raw.githubusercontent.com/FantasmaGlad/Bobine/main/Assets/Images/LogoBanniere.png" width="100%">
          </p>

          <p align="center">
            <img alt="Bobine — Canal Bêta" src="https://raw.githubusercontent.com/FantasmaGlad/Bobine/main/Assets/Images/Versions/Beta.png" width="220">
          </p>

          # Bobine — Bêta (lot curé)

          > **Canal Bêta (accès anticipé).** Lots de fonctionnalités et correctifs sélectionnés et testés avant leur passage en Stable — plus avancé que Stable, plus testé que Canary. Une version stable équivalente ou plus récente la remplace toujours automatiquement.

          Pre-release curée : un lot de fonctionnalités/correctifs sélectionné par le mainteneur, publié manuellement — plus testé que Canary (qui suit chaque commit de main), moins que Stable. Republiée **en place** sur ce même tag mobile `beta` (jamais un nouveau tag par itération) à chaque nouveau lot. Une version stable équivalente ou plus récente la remplace toujours automatiquement.

          Réservée aux utilisateurs ayant activé le canal Bêta (Réglages → Mises à jour, `install.sh --channel=beta`, ou l'assistant Tauri). Pour suivre chaque commit de main sans attendre un lot, voir le [canal Canary](https://github.com/FantasmaGlad/Bobine/releases/tag/canary).

          **Basé sur** commit `__COMMIT__` · version à venir `__VERSION__`

          ---

          NOTES_EOF
          sed -i "s/__COMMIT__/${{ needs.version.outputs.commit_short }}/; s/__VERSION__/${{ needs.version.outputs.base_version }}/" /tmp/beta-notes.md
          python3 scripts/ci/render-rolling-notes.py beta >> /tmp/beta-notes.md

          # Bloc dynamique (changelog) ajouté à part, pas via sed : un message
          # de commit peut contenir '/', '&' ou d'autres caractères qui
          # casseraient une substitution sed, et un fence de code (```) rend le
          # changelog bien plus lisible qu'un paragraphe brut (le Markdown
          # fusionne des lignes consécutives sans ligne vide entre elles).
          LAST_STABLE="$(git tag --list 'V*' --sort=-v:refname | grep -E '^V[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          if [ -n "${LAST_STABLE}" ]; then
            CHANGELOG_HEADING="Changements depuis ${LAST_STABLE}"
            CHANGELOG="$(git log "${LAST_STABLE}..HEAD" --oneline --no-merges | head -50)"
          else
            CHANGELOG_HEADING="Changements récents"
            CHANGELOG="$(git log --oneline --no-merges | head -50)"
          fi
          {
            echo "---"
            echo ""
            echo "## ${CHANGELOG_HEADING}"
            echo ""
            echo '```'
            echo "${CHANGELOG}"
            echo '```'
            echo ""
            echo "---"
            echo ""
            echo "Retour à la Stable à tout moment, sans perte de données : Réglages → Mises à jour logicielles → Canal de mise à jour → Stable."
          } >> /tmp/beta-notes.md
          echo "notes_path=/tmp/beta-notes.md" >> "$GITHUB_OUTPUT"
      - name: Delete previous Beta release (assets get fully replaced, not merged)
        run: gh release delete beta --yes || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish Beta release
        run: |
          gh release create beta release-assets/* \
            --title "Bobine — Bêta (lot curé)" \
            --notes-file "${{ steps.notes.outputs.notes_path }}" \
            --prerelease \
            --target "${{ github.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}

  publish-linux-packages:
    name: Publier les dépôts Linux (packages.bobine.fit)
    needs: [version, linux-deb, linux-package-signing, release-stable, release-beta, release-canary]
    if: |
      always() && !cancelled() && needs.linux-package-signing.result == 'success' &&
      (needs.release-stable.result == 'success' || needs.release-beta.result == 'success' || needs.release-canary.result == 'success')
    runs-on: ubuntu-latest
    concurrency:
      group: publish-linux-packages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FantasmaGlad/bobine-packages
          ref: gh-pages
          path: package-repo
          ssh-key: ${{ secrets.PACKAGES_DEPLOY_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FantasmaGlad/BobineWeb
          ref: 726451fea1cee0c58292e365a07e46fcee594cef
          path: package-verification
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobine-linux-packages-signed
          path: package-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobine-linux-deb
          path: package-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobine-linux-deb-arm64
          path: package-assets
      - name: Installer les outils de dépôt
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro rpm gnupg createrepo-c
          . scripts/ci/container-images.sh
          docker pull "$ARCH_IMAGE"
      - name: Préparer et vérifier les dépôts signés (Debian, RPM et Arch)
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          GNUPGHOME: ${{ runner.temp }}/bobine-signing
          CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          rpm --import package-assets/bobine.gpg
          bash scripts/ci/prepare-package-repository.sh deb "$CHANNEL" package-assets package-repo
          bash scripts/ci/prepare-package-repository.sh rpm "$CHANNEL" package-assets package-repo
          bash scripts/ci/prepare-package-repository.sh arch "$CHANNEL" package-assets package-repo
      - name: Vérifier toute la chaîne APT, DNF et Pacman avant publication
        run: |
          # Les index sont produits avec sudo : sans changement de propriétaire, le noyau refuse les liens physiques que le
          # jeu de corruptions crée pour copier le dépôt (EPERM sur bobine.db.tar.gz).
          sudo chown -R "$(id -u):$(id -g)" package-repo
          python3 package-verification/deploy/onion/verify-packages.py package-repo
          python3 package-verification/deploy/onion/test-verify-packages.py package-repo
          size=$(du -sb --exclude=.git package-repo | cut -f1)
          echo "Taille du site de paquets : $size octets"
          test "$size" -lt 950000000
      - name: Publier sur gh-pages sans écraser les pages vitrines
        env:
          CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          cd package-repo
          git config user.name fanta
          git config user.email 193235053+FantasmaGlad@users.noreply.github.com
          git add -A -- debian/ fedora/ arch/ bobine.gpg latest.json mirror-packages.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(packages): actualiser les depots debian, fedora et arch ($CHANNEL)"
            git push origin gh-pages
          fi
      - name: Retirer la clé privée du runner
        if: always()
        env:
          GNUPGHOME: ${{ runner.temp }}/bobine-signing
        run: |
          gpgconf --kill gpg-agent || true
          rm -rf "$GNUPGHOME"


  notify-web-release:
    name: Notifier le miroir web après publication
    needs: [version, publish-linux-packages]
    if: ${{ always() && !cancelled() && needs.publish-linux-packages.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Envoyer bobine-release à BobineWeb
        env:
          BOBINE_WEB_DISPATCH_TOKEN: ${{ secrets.BOBINE_WEB_DISPATCH_TOKEN }}
          RELEASE_CHANNEL: ${{ needs.version.outputs.channel }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash scripts/ci/notify-web-release.sh
