        run: |
          python scripts/ci/stage-media.py --dest backend\dist\Bobine
      - name: Fournir ffmpeg.exe/ffprobe.exe (build statique BtbN winarm64 avec repli win64)
        shell: pwsh
        run: |
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-winarm64-gpl.zip"
          $ffmpegFallbackUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          curl.exe -fL --retry 5 --retry-delay 5 "$ffmpegUrl" -o ffmpeg.zip
          if ($LASTEXITCODE -ne 0) {
              Write-Host "Repli sur le build FFmpeg win64..."
              curl.exe -fL --retry 5 --retry-delay 5 "$ffmpegFallbackUrl" -o ffmpeg.zip
          }
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extracted
          $bin = Get-ChildItem -Path ffmpeg-extracted -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1 -ExpandProperty DirectoryName
          Copy-Item "$bin\ffmpeg.exe" backend\dist\Bobine\
          Copy-Item "$bin\ffprobe.exe" backend\dist\Bobine\
      - name: Vérifier que BobineBackend.exe démarre et répond à /api/health
        working-directory: backend/dist/Bobine
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath ".\BobineBackend.exe" -RedirectStandardError "backend_err.log" -RedirectStandardOutput "backend_out.log" -PassThru
          $ready = $false
          for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 1
              try {
                  $response = Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/health" -UseBasicParsing -TimeoutSec 2
                  if ($response.StatusCode -eq 200) {
                      $ready = $true
                      Write-Host "Backend opérationnel : $($response.Content)"
                      break
                  }
              } catch {
                  # Attente de disponibilité
              }
          }
          if (-not $ready) {
              Write-Host "=== Backend stderr ==="
              if (Test-Path "backend_err.log") { Get-Content "backend_err.log" }
              Write-Host "=== Backend stdout ==="
              if (Test-Path "backend_out.log") { Get-Content "backend_out.log" }
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              exit 1
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
      - name: Compiler l'installeur ARM64 (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
              choco install innosetup -y --no-progress
          }
          $iscc = if (Get-Command ISCC.exe -ErrorAction SilentlyContinue) { "ISCC.exe" } elseif (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") { "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" } else { "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyAppVersion=${{ needs.version.outputs.display_version }}" "/DMyOutputVersion=${{ needs.version.outputs.filename_version }}" "/DMyOutputSuffix=-arm64" "packaging\windows\bobine.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: bobine-windows-installer-arm64
          path: dist-installer/Bobine-Setup-*-arm64.exe

  linux-desktop-deb:
    # Packaging Linux non-headless (.deb).
    # Construit le frontend Next.js, les exécutables PyInstaller Linux
    # (BobineBackend + BobineTray), assemble l'arborescence Debian et valide
    # l'intégrité et l'installation réelle du paquet .deb sur ubuntu-latest.
    name: Linux desktop packaging (.deb)
    runs-on: ubuntu-latest
    needs: [version]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build du frontend (export statique)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Installer les dépendances Python + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller
      - name: Identifiants de build (VERSION bundlée + COMMIT)
        run: |
          echo "${{ needs.version.outputs.commit_short }}" > COMMIT
          if [ "${{ needs.version.outputs.channel }}" = "beta" ] || [ "${{ needs.version.outputs.channel }}" = "canary" ]; then
            echo "${{ needs.version.outputs.display_version }}" > VERSION
          fi
      - name: Compiler et contrôler le composant audio natif (bobine-media)
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "60"
        run: |
          mkdir -p "$RUNNER_TEMP/media-stage"
          python3 scripts/ci/stage-media.py --dest "$RUNNER_TEMP/media-stage"
      - name: Construire le paquet Debian (.deb)
        env:
          VERSION: ${{ needs.version.outputs.deb_version }}
          DEB_FILENAME_VERSION: ${{ needs.version.outputs.filename_version }}
        run: |
          ./packaging/linux/build_deb.sh
      - name: Valider les métadonnées d'application (AppStream, .desktop)
        run: |
          sudo apt-get install -y --no-install-recommends appstream desktop-file-utils
          appstreamcli validate --pedantic --no-net packaging/linux/bobine.metainfo.xml
          desktop-file-validate packaging/linux/bobine.desktop
      - name: Inspecter et valider la structure du paquet .deb
        run: |
          dpkg-deb -I dist-deb/*.deb
          dpkg-deb -c dist-deb/*.deb
      - name: Tester l'installation réelle sur ubuntu-latest
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist-deb/*.deb
          test -x /usr/bin/bobine
          test -f /usr/share/applications/com.bobine.app.desktop
          test -f /usr/share/metainfo/com.bobine.app.metainfo.xml
          test -f /usr/lib/systemd/user/bobine.service
          test -x /usr/lib/bobine/BobineBackend
          test -x /usr/lib/bobine/BobineTray
          test -x /usr/lib/bobine/bobine-media
          python3 scripts/ci/stage-media.py --check /usr/lib/bobine/bobine-media
          test -f /usr/share/icons/hicolor/256x256/apps/bobine.png
          test -f /usr/share/pixmaps/bobine.png
      - uses: actions/upload-artifact@v4
        with:
          name: bobine-linux-deb
          path: dist-deb/*.deb

