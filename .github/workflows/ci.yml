name: CI

# Intégration continue Bobine : à chaque push sur main et à chaque pull request,
# on construit le frontend et les paquets, on teste le backend sous trois
# versions de Python, le navigateur Firefox et les composants natifs.

on:
  push:
    branches: [main]
    tags: ['v*', 'V*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Tag Stable à (re)publier (ex. V3.0.1) — republie manuellement une
          release stable sans pousser de tag. Laisser vide si publish_beta
          ou publish_canary est coché.
        required: false
      publish_beta:
        description: >-
          Publier/mettre à jour la release Bêta curée (tag mobile unique
          "beta") depuis la référence choisie ci-dessus (Use workflow from)
          — un seul fichier de release Bêta sur GitHub, republié en place à
          chaque déclenchement plutôt qu'un nouveau tag par itération.
          Jamais automatique : seul un déclenchement manuel publie sur ce
          canal (lots choisis par le mainteneur).
        type: boolean
        default: false
      publish_canary:
        description: >-
          Publier/mettre à jour la release Canary (tag mobile unique
          "canary", rolling) depuis la référence choisie ci-dessus — utile
          pour republier sans nouveau commit (ex. après un correctif
          d'infra CI). Un push direct sur main publie déjà automatiquement
          sur ce canal ; cette case sert aux republications manuelles.
        type: boolean
        default: false

# Une pull request annule son exécution précédente. Un push (main, tag) ou un
# déclenchement manuel, lui, n'est JAMAIS annulé : un job de publication
# interrompu entre `gh release delete` et `gh release create` laisserait le
# canal sans release. Les exécutions suivantes attendent leur tour (GitHub ne
# garde que la plus récente en attente).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Résout la version et le CANAL une seule fois pour tous les jobs de
  # packaging. Trois canaux structurellement
  # séparés :
  # - "stable" : déclenché par un tag Git Vx.y.z strict (pas de suffixe —
  #   les tags -beta.N/-canary.N par itération sont abandonnés). Un nouveau
  #   tag/release par version, comme avant : historique normal et attendu.
  # - "canary" : déclenché AUTOMATIQUEMENT à chaque push sur main (la Canary
  #   suit main en continu, cf. incident du 8 sept. où l'ancienne release
  #   Bêta rolling est restée 6 commits en retard faute de republication
  #   manuelle), ou manuellement (workflow_dispatch, case publish_canary
  #   cochée) depuis n'importe quelle référence (choisie via "Use workflow
  #   from" dans l'UI Actions — utile pour republier sans nouveau commit, ex.
  #   après un correctif d'infra CI). Publie TOUJOURS sous le même tag mobile
  #   "canary" — un seul fichier de release Canary sur GitHub, jamais
  #   d'accumulation, republié en place par le job release-canary à chaque
  #   déclenchement. Zéro curation : c'est le dernier commit de main, non
  #   testé.
  # - "beta"   : déclenché UNIQUEMENT manuellement (workflow_dispatch, case
  #   publish_beta cochée) depuis la référence choisie par le mainteneur —
  #   jamais automatiquement sur un simple push. Lots de fonctionnalités/
  #   correctifs choisis, publiés quand le mainteneur le décide. Publie sous
  #   le tag mobile "beta", republié en place par le job release-beta.
  # Ni tag ni push sur main ni publish_beta/publish_canary (pull_request,
  # push sur une autre branche) : CHANNEL="none" — les jobs de publication
  # (release-stable, release-beta, release-canary) ne se déclenchent pas,
  # seuls les tests/builds de vérification tournent.
  version:
    name: Resolve release version & channel
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      base_version: ${{ steps.resolve.outputs.base_version }}
      display_version: ${{ steps.resolve.outputs.display_version }}
      deb_version: ${{ steps.resolve.outputs.deb_version }}
      filename_version: ${{ steps.resolve.outputs.filename_version }}
      commit_short: ${{ steps.resolve.outputs.commit_short }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Vérifier les outils de publication sans réseau
        run: |
          python3 scripts/ci/test-notify-web-release.py
          python3 -m unittest discover -s scripts/ci -p 'test_*.py' -q
          python3 scripts/ci/test-package-versions.py --family debian
      - name: Résoudre version, canal et identifiants de build
        id: resolve
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_BETA: ${{ inputs.publish_beta || false }}
          RELEASE_CANARY: ${{ inputs.publish_canary || false }}
        run: python3 scripts/ci/resolve-release.py

  frontend:
    name: Frontend build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Frontend and storage policy tests
        run: |
          npm test
          node ../scripts/ci/test-storage-policy.mjs
      - name: Build static export
        run: npm run build

  firefox-smoke:
    # Compatibilité Firefox/Gecko :
    # un vrai Firefox (préinstallé sur le runner, avec geckodriver) pilote une
    # instance de TEST isolée — import par morceaux, négociation de la version
    # vidéo, protocole (HEAD/404 JSON), pages principales. Échoue si une page
    # affiche une erreur applicative ou si l'interface se fige pendant l'import.
    # Le succès de ce parcours navigateur fait partie du contrôle ci-ok.
    name: Firefox smoke tests (geckodriver)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints-desktop.txt
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install backend dependencies
        run: |
          python -m pip install pip==26.2.2
          python -m pip install -r backend/requirements.txt
      - name: Start isolated test backend
        run: |
          mkdir -p "$RUNNER_TEMP/bobine-e2e"
          cd backend
          BOBINE_USE_XDG=1 XDG_DATA_HOME="$RUNNER_TEMP/bobine-e2e/data" XDG_CONFIG_HOME="$RUNNER_TEMP/bobine-e2e/cfg" \
            nohup python ../scripts/browser-bench/run_test_backend.py 8078 > "$RUNNER_TEMP/backend.log" 2>&1 &
          for _ in $(seq 1 40); do
            curl -fs http://127.0.0.1:8078/api/health && break
            sleep 1
          done
          curl -fs http://127.0.0.1:8078/api/health
      - name: Firefox end-to-end bench
        run: |
          firefox --version
          geckodriver --version
          python scripts/browser-bench/e2e_firefox.py --resume
      - name: Backend log (on failure)
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/backend.log"

  backend:
    # 3.11 : runtime embarqué de l'APK Android TV (seul Python de Chaquopy à
    # fournir armeabi-v7a). 3.12 : paquets de bureau. 3.13 : runtime de l'APK
    # téléphone/tablette. Une syntaxe ou une API postérieure à 3.11 ne doit pas
    # entrer sans casser ce job.
    name: Backend checks (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints-desktop.txt
      - name: Install dependencies
        run: |
          python -m pip install pip==26.2.2
          python -m pip install -r backend/requirements.txt
      - name: Vérifier les dépendances résolues
        run: python -m pip check
      - name: Syntax check (compile all sources)
        run: python -m compileall -q backend/app scripts
      - name: Install system dependencies (ffmpeg)
        # Comme le job Firefox, les tests CPU n’installent pas les modèles ASR
        # ni les pilotes recommandés. Le miroir peut rester lent même sans eux.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      # pytest (et non `unittest discover`) : c'est la commande documentée
      # et `unittest` ignore les tests écrits en simples
      # fonctions (suivi de séquence, horloge de lecture, diffusion par canal,
      # écrans...), qui n'étaient donc jamais exécutés en CI. pytest exécute
      # aussi les `unittest.TestCase` existants.
      # httpx : requis par starlette.testclient.TestClient (tests de l'API), non
      # déclaré dans requirements.txt car inutile à l'exécution.
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-test.txt
      - name: Run test suite (pytest)
        run: python -m pytest backend/tests -q -W error::RuntimeWarning -W error::pytest.PytestUnraisableExceptionWarning
        env:
          PYTHONPATH: backend
      - name: Relever le graphe Python installé
        run: python -m pip inspect > python-environment.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-environment-${{ matrix.python }}
          path: python-environment.json
          if-no-files-found: error

  backend-android-compat:
    name: Backend Android (Pydantic v1, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Installer le profil FastAPI/Pydantic Android
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import os, re
          requirements = Path("backend/requirements.txt").read_text().splitlines()
          # BaseSettings est intégré à Pydantic v1 ; pydantic-settings exige v2.
          requirements = [line for line in requirements if line.strip() != "pydantic-settings" and not line.startswith("-c ")]
          gradle = Path("android/app/build.gradle.kts").read_text()
          for package in ("pydantic", "fastapi"):
              requirements.append(re.search(r'install\("(' + package + r'==[^"\n]+)"\)', gradle).group(1))
          requirements += ["httpx==0.24.1", "pytest==9.1.1"]
          Path(os.environ["RUNNER_TEMP"], "android-backend.txt").write_text("\n".join(requirements))
          PYTHON
          python -m pip install -r "$RUNNER_TEMP/android-backend.txt"
      - name: Importer l'application et vérifier les requêtes de stockage
        run: |
          python -c 'import pydantic, fastapi; assert pydantic.VERSION == "1.10.26"; assert fastapi.__version__ == "0.99.1"; import app.main'
          python -m pytest backend/tests/test_pydantic_v1_compat.py backend/tests/test_storage_http_compat.py -q
        env:
          PYTHONPATH: backend
          BOBINE_USE_XDG: "1"
          XDG_DATA_HOME: ${{ runner.temp }}/android-backend/data
          XDG_CONFIG_HOME: ${{ runner.temp }}/android-backend/config

  assistant-core:
    name: Assistant core (Rust)
    runs-on: ubuntu-latest
    needs: [version]
    defaults:
      run:
        working-directory: assistant
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            assistant/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'assistant/**/Cargo.toml', 'assistant/Cargo.lock') }}
      - name: Install system dependencies (WebKitGTK & AppIndicator)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Identifiants de build (VERSION bundlée + COMMIT)
        working-directory: .
        run: |
          echo "${{ needs.version.outputs.commit_short }}" > COMMIT
          if [ "${{ needs.version.outputs.channel }}" = "beta" ] || [ "${{ needs.version.outputs.channel }}" = "canary" ]; then
            echo "${{ needs.version.outputs.display_version }}" > VERSION
          fi
      - name: Clippy (warnings = erreurs)
        run: |
          rustup component add clippy
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace
      - name: Build Bobine Assistant (Linux binary)
        run: |
          cargo build --release --locked --bin bobine-assistant
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bobine-assistant-linux
          path: assistant/target/release/bobine-assistant

  assistant-core-arm64:
    name: Assistant core ARM64 (Rust)
    runs-on: ubuntu-24.04-arm
    needs: [version]
    defaults:
      run:
        working-directory: assistant
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache cargo (ARM64)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            assistant/target
          key: cargo-${{ runner.os }}-arm64-${{ hashFiles('rust-toolchain.toml', 'assistant/**/Cargo.toml', 'assistant/Cargo.lock') }}
      - name: Install system dependencies (WebKitGTK & AppIndicator)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Identifiants de build (VERSION bundlée + COMMIT)
        working-directory: .
        run: |
          echo "${{ needs.version.outputs.commit_short }}" > COMMIT
          if [ "${{ needs.version.outputs.channel }}" = "beta" ] || [ "${{ needs.version.outputs.channel }}" = "canary" ]; then
            echo "${{ needs.version.outputs.display_version }}" > VERSION
          fi
      - name: Clippy et tests ARM64
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
      - name: Build Bobine Assistant ARM64 (Linux aarch64 binary)
        run: |
          cargo build --release --locked --bin bobine-assistant
          cp target/release/bobine-assistant target/release/bobine-assistant-arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bobine-assistant-linux-arm64
          path: assistant/target/release/bobine-assistant-arm64

  devices-sidecar:
    # Sidecar Rust de l'onglet Périphériques (Windows/macOS) : protocole JSON-RPC, liste blanche de
    # méthodes, analyseurs des sorties d'outils. Les binaires Windows/macOS sont construits et
    # embarqués dans leurs jobs de packaging respectifs.
    name: Devices sidecar (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devices
    env:
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_TIMEOUT: "60"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            devices/target
          key: cargo-devices-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'devices/Cargo.toml', 'devices/Cargo.lock') }}
      - name: Clippy
        run: |
          rustup component add clippy
          cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked

  media-component:
    # Composant natif d'inspection audio (bobine-media), désactivé par défaut (réglage « media_native ») :
    # formatage, clippy, tests et licences sur chaque plateforme desktop. L'embarquement dans les paquets
    # deb, Windows et macOS est contrôlé par les jobs de packaging, celui des APK Android par `android-build`
    # (et des AAB par play-aab.yml). Ce job ne valide aucun appareil réel.
    name: Media component (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Chaque architecture de paquet doit passer les mêmes contrôles bloquants.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest]
    defaults:
      run:
        shell: bash
        working-directory: media
    env:
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_TIMEOUT: "60"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            media/target
          key: cargo-media-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'media/Cargo.toml', 'media/Cargo.lock') }}
      - name: Format et Clippy
        run: |
          rustup component add clippy rustfmt
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Licences des dépendances embarquées
        if: runner.os == 'Linux' && runner.arch == 'X64'
        working-directory: .
        run: python3 scripts/ci/check-media-licenses.py
      - name: Compiler et relever la taille
        run: |
          cargo build --release --locked
          ls target/release/bobine-media* | grep -v '\.d$' | xargs wc -c

  android-build:
    # Compile et signe les APK Android (Chaquopy + FastAPI embarqué + binaires FFmpeg ARM).
    # Téléphone/tablette : arm64-v8a (Python 3.13). Android TV : armeabi-v7a +
    # arm64-v8a (Python 3.11, seul runtime Chaquopy disponible en 32 bits).
    # Inclus dans les assets officiels des releases Stable (Bobine-x.y.z.apk), Bêta (Bobine-beta.apk)
    # et Canary (Bobine-canary.apk) à partir de la version 3.0.2.
    #
    # Les quatre secrets sont requis hors PR ; une configuration partielle échoue
    # toujours. Une PR externe sans secret conserve les contrôles de démarrage debug.
    name: Android (Chaquopy) — build & sign
    runs-on: ubuntu-latest
    needs: [version]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth 0 (pas le defaut 1) : requis pour que `git rev-list
          # --count HEAD` ci-dessous compte l'historique reel plutot que de
          # toujours renvoyer 1 sur un clone superficiel - c'est ce compteur
          # qui sert de versionCode Android (doit croitre a chaque commit).
          fetch-depth: 0
      - name: Vérifier que les secrets de signature sont configurés
        id: check_secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python scripts/ci/check-android-signing.py ${{ github.event_name == 'pull_request' && '--allow-missing' || '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.check_secrets.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances npm (node_modules absent d'un checkout frais — la tâche Gradle buildFrontendStatic suppose qu'elles existent déjà)
        if: steps.check_secrets.outputs.configured == 'true'
        working-directory: frontend
        run: npm ci
      # Chaquopy cherche `python3.<x>` sur le PATH pour chaque version du
      # projet : 3.13 (flavor mobile) et 3.11 (flavor TV).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.check_secrets.outputs.configured == 'true'
        with:
          python-version: |
            3.13
            3.11
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.check_secrets.outputs.configured == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: steps.check_secrets.outputs.configured == 'true'
        with:
          # le paquet legacy "tools" (installé par
          # défaut par cette action, `packages: "tools platform-tools"`) a
          # disparu du dépôt SDK Google ("Failed to find package 'tools'",
          # exit code 1) — cassait tout le job avant même l'étape suivante,
          # qui installe déjà les seuls paquets réellement utilisés
          # (platforms;android-36, build-tools;36.1.0). platform-tools seul
          # suffit ici.
          packages: "platform-tools"
      - name: Installer les plateformes/outils Android requis
        if: steps.check_secrets.outputs.configured == 'true'
        run: python scripts/ci/setup-android-sdk.py
      - name: Décoder le keystore depuis le secret
        if: steps.check_secrets.outputs.configured == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/bobine-release.keystore"
      - name: Résoudre versionName/versionCode dynamiques
        if: steps.check_secrets.outputs.configured == 'true'
        id: android_version
        run: echo "version_code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
      # Le backend embarqué compare ce commit à celui du canal Bêta/Canary
      # pour proposer une mise à jour ; sans fichier COMMIT il vaut "unknown"
      # et aucune mise à jour n'est jamais proposée sur ces canaux.
      - name: Identifiants de build (COMMIT bundlé)
        if: steps.check_secrets.outputs.configured == 'true'
        run: echo "${{ needs.version.outputs.commit_short }}" > COMMIT
      # Commit épinglé (et non la branche `main` du dépôt tiers) + empreintes
      # SHA-256 : un binaire exécuté sur les appareils des utilisateurs ne doit
      # jamais changer sans qu'on l'ait relu.
      - name: Télécharger les binaires statiques ffmpeg/ffprobe ARM64 (Bionic NDK)
        if: steps.check_secrets.outputs.configured == 'true'
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          BASE_URL="https://raw.githubusercontent.com/hzw1199/Android-FFmpeg-Prebuilt/90231cc0105aef4f76926b911535f5eb73511b86/ffmpeg-8.1.1/bin"
          cd android/app/src/main/jniLibs/arm64-v8a
          curl -fL --retry 5 --retry-delay 5 -o libffmpeg.so "$BASE_URL/ffmpeg"
          curl -fL --retry 5 --retry-delay 5 -o libffprobe.so "$BASE_URL/ffprobe"
          echo "480defd776199b5434008565974de5bf99822371c3cd9c1f130fda2c57de6439  libffmpeg.so" | sha256sum -c -
          echo "e66d481eb55af07282ea4efcdba5d18b564f809e9e40441dede7cc6ee9f88224  libffprobe.so" | sha256sum -c -
          chmod +x libffmpeg.so libffprobe.so
      # Aucun binaire 32 bits n'est publié par le dépôt tiers : compilation
      # depuis les sources officielles (android/scripts/build_ffmpeg_armv7.sh),
      # mise en cache tant que le script ne change pas.
      - name: Cache des binaires ffmpeg/ffprobe armeabi-v7a
        if: steps.check_secrets.outputs.configured == 'true'
        id: ffmpeg_armv7_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: android/app/src/main/jniLibs/armeabi-v7a
          key: ffmpeg-armv7-${{ hashFiles('android/scripts/build_ffmpeg_armv7.sh') }}
      - name: Compiler ffmpeg/ffprobe armeabi-v7a (NDK r28c)
        if: steps.check_secrets.outputs.configured == 'true' && steps.ffmpeg_armv7_cache.outputs.cache-hit != 'true'
        run: android/scripts/build_ffmpeg_armv7.sh
      # Composant audio natif (Bionic ARM64 et ARM32, alignement 16 Kio vérifié par le script) : sans lui
      # l'option « composant audio natif » des Réglages indique « absent » et l'import garde ffprobe/ffmpeg.
      - name: Compiler le composant audio Android (Bionic ARM64 et ARM32)
        if: steps.check_secrets.outputs.configured == 'true'
        run: scripts/ci/build-media-android.sh
      - name: Build + signature (Gradle)
        if: steps.check_secrets.outputs.configured == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/bobine-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ needs.version.outputs.display_version }}
          ANDROID_VERSION_CODE: ${{ steps.android_version.outputs.version_code }}
        run: ./gradlew :app:assembleMobileRelease :app:assembleTvRelease --no-daemon
      - name: Vérifier les ABI natives des APKs (garde-fou INSTALL_FAILED_NO_MATCHING_ABIS)
        if: steps.check_secrets.outputs.configured == 'true'
        run: |
          scripts/ci/verify-apk-abis.sh "$(ls android/app/build/outputs/apk/mobile/release/*.apk)" arm64-v8a
          scripts/ci/verify-apk-abis.sh "$(ls android/app/build/outputs/apk/tv/release/*.apk)" armeabi-v7a arm64-v8a
      # Bundles .aab pour Google Play (un par application : com.bobine.app et com.bobine.app.tv).
      # Signés avec la clé de téléversement (la même que les APK) ; Google Play les re-signe avec la clé
      # de distribution. La construction et la signature des deux bundles sont bloquantes.
      # La publication sur la console reste manuelle tant qu'aucun compte de service Play n'est configuré.
      - name: Construire les bundles Google Play (.aab)
        if: steps.check_secrets.outputs.configured == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/bobine-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ needs.version.outputs.display_version }}
          ANDROID_VERSION_CODE: ${{ steps.android_version.outputs.version_code }}
        run: ./gradlew :app:bundleMobileRelease :app:bundleTvRelease --no-daemon
      - name: Vérifier signature et contenu des bundles
        if: steps.check_secrets.outputs.configured == 'true'
        run: |
          python3 scripts/ci/verify-android-bundles.py android/app/build/outputs/bundle/mobileRelease/app-mobile-release.aab
          python3 scripts/ci/verify-android-bundles.py android/app/build/outputs/bundle/tvRelease/app-tv-release.aab --tv
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.check_secrets.outputs.configured == 'true'
        with:
          name: bobine-android-aab
          path: android/app/build/outputs/bundle/*Release/*.aab
          if-no-files-found: error
      - name: Vérifier la signature des APKs produits
        if: steps.check_secrets.outputs.configured == 'true'
        run: |
          while IFS= read -r -d '' APK; do
            echo "Vérification signature : $APK"
            "${BOBINE_ANDROID_BUILD_TOOLS}/apksigner" verify --print-certs "$APK"
            "${BOBINE_ANDROID_BUILD_TOOLS}/zipalign" -c -P 16 4 "$APK"
          done < <(find android/app/build/outputs/apk -name '*release*.apk' -print0)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.check_secrets.outputs.configured == 'true'
        with:
          name: bobine-android-apk
          path: android/app/build/outputs/apk/mobile/release/*.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.check_secrets.outputs.configured == 'true'
        with:
          name: bobine-android-tv-apk
          path: android/app/build/outputs/apk/tv/release/*.apk

  android-startup:
    name: Android APK startup (${{ matrix.flavor }}, emulator x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        flavor: [mobile, tv]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: |
            3.13
            3.11
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - run: python scripts/ci/setup-android-sdk.py --skip-ndk
      - name: Construire l'APK de test avec le backend embarqué
        working-directory: android
        env:
          ANDROID_VERSION_NAME: ${{ needs.version.outputs.display_version }}
        run: |
          if [ "${{ matrix.flavor }}" = "mobile" ]; then
            ./gradlew :app:assembleMobileDebug -PbobineEmulator=true --no-daemon
          else
            ./gradlew :app:assembleTvDebug -PbobineEmulator=true --no-daemon
          fi
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Les runners Linux x86_64 accélèrent une image x86_64. Cette variante
      # debug vérifie Chaquopy/le service réel ; les APK ARM signés restent
      # contrôlés séparément par android-build et la recette sur matériel.
      - name: Installer, démarrer et interroger le serveur dans l'APK
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none
          script: scripts/ci/smoke-android-apk.sh "${{ matrix.flavor }}"
      - name: Conserver le diagnostic de démarrage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-startup-${{ matrix.flavor }}
          path: android-startup-logs/
          if-no-files-found: warn

  install-script:
    name: install.sh sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Vérification de syntaxe bash
        run: bash -n install.sh
      - name: Le compteur d'étapes STEP_TOTAL reflète le nombre d'appels à step()
        run: |
          declared=$(grep -oE '^STEP_TOTAL=[0-9]+' install.sh | head -1 | cut -d= -f2)
          actual=$(grep -cE '^[[:space:]]*step ' install.sh)
          echo "STEP_TOTAL=${declared} ; appels step()=${actual}"
          test "${declared}" = "${actual}"
      - name: L'installation en une commande (tube curl | bash) s'amorce sans dépôt local
        run: |
          # Reproduit `curl … | sudo bash` : le script arrive par stdin, hors
          # de tout dépôt — régression historique : `${BASH_SOURCE[0]}` non
          # défini sous `set -u` faisait planter le script avant tout message.
          cd "$(mktemp -d)"
          out=$(cat "${GITHUB_WORKSPACE}/install.sh" | sudo bash -s -- --as-user "$(id -un)" --dry-run -y --lang=en 2>&1)
          echo "$out"
          grep -q "would clone" <<<"$out"

  windows-build:
    # PyInstaller ne cross-compile pas — ce
    # job est le seul endroit où le packaging Windows (bobine.spec) est
    # réellement construit sur un vrai Windows. Écrit et vérifié localement
    # sur Linux (import réel de l'exécutable figé) mais
    # jamais exécuté tel quel sur Windows avant son premier passage ici —
    # à surveiller de près au premier déclenchement.
    name: Windows packaging (PyInstaller + Inno Setup)
    runs-on: windows-latest
    needs: [version]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Avant toute étape pip : pip lance `rustc --version` (délai de 0,5 s) et interrompt l'installation implicite de la toolchain.
      - name: Installer la toolchain Rust (avant pip)
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build du frontend (export statique)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints-desktop.txt
      - name: Installer les dépendances Python + PyInstaller
        run: |
          python -m pip install pip==26.2.2
          python -m pip install -r backend/requirements.txt
          python -m pip install -r backend/requirements-build.txt
          python -m pip check
      - name: Identifiants de build (VERSION bundlée + COMMIT)
        shell: bash
        run: |
          echo "${{ needs.version.outputs.commit_short }}" > COMMIT
          if [ "${{ needs.version.outputs.channel }}" = "beta" ] || [ "${{ needs.version.outputs.channel }}" = "canary" ]; then
            echo "${{ needs.version.outputs.display_version }}" > VERSION
          fi
      - name: Construire BobineBackend.exe + BobineTray.exe
        working-directory: backend
        run: pyinstaller ../packaging/windows/bobine.spec
      - name: Compiler le sidecar des périphériques (bobine-devices.exe)
        working-directory: devices
        shell: pwsh
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "60"
        run: |
          cargo test --locked
          cargo build --release --locked
          Copy-Item "target\release\bobine-devices.exe" ..\backend\dist\Bobine\
      - name: Compiler et embarquer le composant audio natif (bobine-media.exe)
        shell: pwsh
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "60"
        run: |
          python scripts/ci/stage-media.py --dest backend\dist\Bobine
          if (-not (Test-Path backend\dist\Bobine\bobine-media.exe)) { throw "bobine-media.exe manquant" }
      - name: Fournir FFmpeg/FFprobe x64 (archive et architecture vérifiées)
        shell: pwsh
        run: packaging/windows/stage-ffmpeg.ps1 -Architecture x64
      - name: Vérifier que BobineBackend.exe démarre et répond à /api/health
        shell: pwsh
        # Journaux et données hors de dist/Bobine : Inno Setup embarque tout ce dossier.
        run: scripts/ci/smoke-windows-backend.ps1 -Exe backend\dist\Bobine\BobineBackend.exe -LogDir "$env:RUNNER_TEMP\bobine-dist-logs" -DataRoot "$env:RUNNER_TEMP\bobine-dist-data"
      - name: Compiler l'installeur (Inno Setup, préinstallé sur windows-latest)
        run: ISCC.exe /DMyAppVersion=${{ needs.version.outputs.display_version }} /DMyOutputVersion=${{ needs.version.outputs.filename_version }} packaging\windows\bobine.iss
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bobine-windows-installer
          path: dist-installer/*.exe
      # Cycle de vie réel de l'installeur : installation silencieuse, arborescence, lancement du backend installé, désinstallation.
      - name: Installer Bobine-Setup en silence (dossier de test, journal conservé)
        shell: pwsh
        env:
          FILENAME_VERSION: ${{ needs.version.outputs.filename_version }}
        run: scripts/ci/smoke-windows-installer.ps1 -Action Install -Installer "dist-installer\Bobine-Setup-$env:FILENAME_VERSION.exe" -InstallDir "$env:RUNNER_TEMP\bobine-installed" -LogDir "$env:RUNNER_TEMP\bobine-installer-logs"
      - name: Vérifier l'arborescence installée
        shell: pwsh
        env:
          DISPLAY_VERSION: ${{ needs.version.outputs.display_version }}
        run: scripts/ci/smoke-windows-installer.ps1 -Action Verify -InstallDir "$env:RUNNER_TEMP\bobine-installed" -LogDir "$env:RUNNER_TEMP\bobine-installer-logs" -DistDir backend\dist\Bobine -ExpectedVersion $env:DISPLAY_VERSION
      - name: Lancer le backend installé et sonder /api/health
        shell: pwsh
        run: scripts/ci/smoke-windows-backend.ps1 -Exe "$env:RUNNER_TEMP\bobine-installed\BobineBackend.exe" -LogDir "$env:RUNNER_TEMP\bobine-installer-logs" -DataRoot "$env:RUNNER_TEMP\bobine-installed-data"
      - name: Désinstaller en silence et vérifier le retrait
        shell: pwsh
        run: scripts/ci/smoke-windows-installer.ps1 -Action Uninstall -InstallDir "$env:RUNNER_TEMP\bobine-installed" -LogDir "$env:RUNNER_TEMP\bobine-installer-logs"
      - name: Journaux de l'installeur et du backend installé
        if: failure()
        shell: pwsh
        run: scripts/ci/smoke-windows-installer.ps1 -Action Logs -InstallDir "$env:RUNNER_TEMP\bobine-installed" -LogDir "$env:RUNNER_TEMP\bobine-installer-logs"

  windows-build-arm64:
    # Packaging Windows 11 ARM64 natif (PC Qualcomm Snapdragon X Elite / X Plus).
    # Construit BobineBackend.exe + BobineTray.exe avec Python 3.12 ARM64 + PyInstaller,
