  linux-deb:
    name: Paquet APT (.deb ${{ matrix.deb_arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    needs: [version]
    if: needs.version.outputs.packaging == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - deb_arch: amd64
            runner: ubuntu-24.04
            artifact: bobine-linux-deb
          - deb_arch: arm64
            runner: ubuntu-24.04-arm
            artifact: bobine-linux-deb-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Installer la toolchain Rust (avant pip)
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build du frontend (export statique)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints-desktop.txt
      - name: Installer les dépendances Python + PyInstaller
        run: |
          python -m pip install pip==26.2.2
          python -m pip install -r backend/requirements.txt
          python -m pip install -r backend/requirements-build.txt
          python -m pip check
      - name: Identifiants de build (VERSION bundlée + COMMIT)
        run: |
          echo "${{ needs.version.outputs.commit_short }}" > COMMIT
          if [ "${{ needs.version.outputs.channel }}" = "beta" ] || [ "${{ needs.version.outputs.channel }}" = "canary" ]; then
            echo "${{ needs.version.outputs.display_version }}" > VERSION
          fi
      - name: Compiler et contrôler le composant audio natif (bobine-media)
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "60"
        run: |
          mkdir -p "$RUNNER_TEMP/media-stage"
          python3 scripts/ci/stage-media.py --dest "$RUNNER_TEMP/media-stage"
      - name: Construire le paquet Debian (.deb)
        env:
          VERSION: ${{ needs.version.outputs.deb_version }}
          DEB_FILENAME_VERSION: ${{ needs.version.outputs.filename_version }}
        run: |
          sudo apt-get $APT_OPTIONS update
          sudo apt-get $APT_OPTIONS install -y --no-install-recommends patchelf
          ./packaging/linux/build_deb.sh
      - name: Valider les métadonnées d'application (AppStream, .desktop)
        if: matrix.deb_arch == 'amd64'
        run: |
          sudo apt-get $APT_OPTIONS install -y --no-install-recommends appstream desktop-file-utils
          appstreamcli validate --pedantic --no-net packaging/linux/bobine.metainfo.xml
          desktop-file-validate packaging/linux/bobine.desktop
      - name: Inspecter et valider la structure du paquet .deb
        run: |
          dpkg-deb -I dist-deb/bobine_*_${{ matrix.deb_arch }}.deb
          dpkg-deb -c dist-deb/bobine_*_${{ matrix.deb_arch }}.deb
      - name: Image du runner
        id: image
        run: echo "version=${ImageOS:-}-${ImageVersion:-}" >> "$GITHUB_OUTPUT"
      - name: Dépendances du paquet en cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/deb-deps
          key: deb-deps-${{ matrix.runner }}-${{ steps.image.outputs.version }}
          restore-keys: deb-deps-${{ matrix.runner }}-
      - name: Tester l'installation réelle (${{ matrix.runner }})
        run: |
          scripts/ci/apt-install-cached.sh ~/deb-deps ./dist-deb/bobine_*_${{ matrix.deb_arch }}.deb
          test -x /usr/bin/bobine
          /usr/bin/bobine --version | grep -q '^bobine '
          test -f /usr/share/applications/com.bobine.app.desktop
          test -f /usr/share/metainfo/com.bobine.app.metainfo.xml
          test -f /usr/lib/systemd/user/bobine.service
          test -x /usr/lib/bobine/BobineBackend
          test -x /usr/lib/bobine/BobineTray
          test -x /usr/lib/bobine/bobine-media
          python3 scripts/ci/stage-media.py --check /usr/lib/bobine/bobine-media
          test -f /usr/share/icons/hicolor/256x256/apps/bobine.png
          test -f /usr/share/pixmaps/bobine.png
      - name: Lancer l'application installée (BobineBackend, /api/health)
        run: bash scripts/ci/smoke-installed-backend.sh
      - name: Vérifier que apt refuse le paquet sur Debian 12 et Ubuntu 22.04 (plancher glibc)
        run: bash scripts/ci/test-glibc-floor.sh deb dist-deb/bobine_*_${{ matrix.deb_arch }}.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 3 }}
          name: ${{ matrix.artifact }}
          path: dist-deb/bobine_*_${{ matrix.deb_arch }}.deb
          if-no-files-found: error

