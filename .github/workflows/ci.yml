name: CI

# Intégration continue Bobine : à chaque push sur main et à chaque pull request,
# on vérifie que le frontend Next.js se construit et que le backend Python est
# syntaxiquement valide avec ses dépendances résolues. Volontairement léger et
# fiable pour un statut vert stable ; la suite de tests (backend/tests/, qui ne
# requiert plus Redis depuis PortabiliteCrossPlatformX Lot 0) pourra être
# ajoutée en tant que job séparé.

on:
  push:
    branches: [main]
    tags: ['v*', 'V*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Tag Stable à (re)publier (ex. V3.0.1) — republie manuellement une
          release stable sans pousser de tag. Laisser vide si publish_beta
          est coché.
        required: false
      publish_beta:
        description: >-
          Publier/mettre à jour la release Bêta (tag mobile unique "beta")
          depuis la référence choisie ci-dessus (Use workflow from) — un seul
          fichier de release Bêta sur GitHub, republié en place à chaque
          déclenchement plutôt qu'un nouveau tag par itération.
        type: boolean
        default: false

# Annule les exécutions précédentes encore en cours sur la même référence.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Résout la version et le CANAL une seule fois pour tous les jobs de
  # packaging (réf. mission "canal Stable/Bêta"). Deux canaux structurellement
  # séparés :
  # - "stable" : déclenché par un tag Git Vx.y.z strict (pas de suffixe —
  #   les tags -beta.N par itération sont abandonnés). Un nouveau tag/release
  #   par version, comme avant : historique normal et attendu.
  # - "beta"   : déclenché manuellement (workflow_dispatch, case
  #   publish_beta cochée) depuis n'importe quelle référence (choisie via
  #   "Use workflow from" dans l'UI Actions, main par défaut). Publie
  #   TOUJOURS sous le même tag mobile "beta" — un seul fichier de release
  #   Bêta sur GitHub, jamais d'accumulation (réf. mission "éviter 1000
  #   fichiers"), republié en place par le job release-beta.
  # Sans tag ni publish_beta (push simple, pull_request), CHANNEL="none" :
  # les jobs de publication (release-stable, release-beta) ne se déclenchent
  # pas, seuls les tests/builds de vérification tournent.
  version:
    name: Resolve release version & channel
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      base_version: ${{ steps.resolve.outputs.base_version }}
      display_version: ${{ steps.resolve.outputs.display_version }}
      deb_version: ${{ steps.resolve.outputs.deb_version }}
      filename_version: ${{ steps.resolve.outputs.filename_version }}
      commit_short: ${{ steps.resolve.outputs.commit_short }}
    steps:
      - uses: actions/checkout@v4
      - name: Résoudre version, canal et identifiants de build
        id: resolve
        run: |
          BASE_VERSION="$(cat VERSION)"
          COMMIT_SHORT="$(git rev-parse --short HEAD)"
          CHANNEL="none"
          TAG_NAME=""

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.tag }}" ]]; then
            TAG_NAME="${{ github.event.inputs.tag }}"
          fi

          if [ -n "${TAG_NAME}" ]; then
            # Tag Stable strict Vx.y.z — plus de suffixe -beta./-rc. accepté
            # ici (le canal Bêta n'utilise plus de tag par itération).
            TAG_VERSION="${TAG_NAME#v}"; TAG_VERSION="${TAG_VERSION#V}"
            if ! [[ "${TAG_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag '${TAG_NAME}' invalide pour une release Stable (attendu Vx.y.z strict, ex. V3.0.1)."
              exit 1
            fi
            if [ "${TAG_VERSION}" != "${BASE_VERSION}" ]; then
              echo "::error::Le tag '${TAG_NAME}' (${TAG_VERSION}) ne correspond pas au fichier VERSION (${BASE_VERSION}). Mettre à jour VERSION avant de taguer."
              exit 1
            fi
            CHANNEL="stable"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.publish_beta }}" == "true" ]]; then
            CHANNEL="beta"
            TAG_NAME="beta"
          fi

          if [ "${CHANNEL}" = "beta" ]; then
            DISPLAY_VERSION="${BASE_VERSION}-beta"     # bundlé (VERSION), AppVersion Windows — cosmétique
            DEB_VERSION="${BASE_VERSION}~beta"         # champ Version: du paquet .deb — syntaxe Debian (le '~' trie AVANT la version finale)
            FILENAME_VERSION="beta"                    # nom de fichier FIXE (exe/dmg/deb) — jamais de '~', jamais de suffixe qui change à chaque build
          else
            DISPLAY_VERSION="${BASE_VERSION}"
            DEB_VERSION="${BASE_VERSION}"
            FILENAME_VERSION="${BASE_VERSION}"
          fi

          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "base_version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "display_version=${DISPLAY_VERSION}" >> "$GITHUB_OUTPUT"
          echo "deb_version=${DEB_VERSION}" >> "$GITHUB_OUTPUT"
          echo "filename_version=${FILENAME_VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit_short=${COMMIT_SHORT}" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build static export
        run: npm run build

  backend:
    name: Backend checks (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Syntax check (compile all sources)
        run: python -m compileall -q backend/app scripts
      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Run test suite (unittest)
        run: python -m unittest discover -s backend/tests

  assistant-core:
    name: Assistant core (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assistant
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            assistant/target
          key: cargo-${{ runner.os }}-${{ hashFiles('assistant/**/Cargo.toml', 'assistant/Cargo.lock') }}
      - name: Install system dependencies (WebKitGTK & AppIndicator)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Clippy (warnings = erreurs)
        run: |
          rustup component add clippy
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Build Bobine Assistant (Linux binary)
        run: |
          cargo build --release --bin bobine-assistant
      - uses: actions/upload-artifact@v4
        with:
          name: bobine-assistant-linux
          path: assistant/target/release/bobine-assistant

  install-script:
    name: install.sh sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérification de syntaxe bash
        run: bash -n install.sh
      - name: Le compteur d'étapes STEP_TOTAL reflète le nombre d'appels à step()
        run: |
          declared=$(grep -oE '^STEP_TOTAL=[0-9]+' install.sh | head -1 | cut -d= -f2)
          actual=$(grep -cE '^[[:space:]]*step ' install.sh)
          echo "STEP_TOTAL=${declared} ; appels step()=${actual}"
          test "${declared}" = "${actual}"

  windows-build:
    # PortabiliteCrossPlatformX Lot 1 : PyInstaller ne cross-compile pas — ce
    # job est le seul endroit où le packaging Windows (bobine.spec) est
    # réellement construit sur un vrai Windows. Écrit et vérifié localement
    # sur Linux (import réel de l'exécutable figé, cf.
    # docs/plan-implementation-portabilite-crossplatformx.md §2) mais
    # jamais exécuté tel quel sur Windows avant son premier passage ici —
    # à surveiller de près au premier déclenchement.
    name: Windows packaging (PyInstaller + Inno Setup)
    runs-on: windows-latest
    needs: [version]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build du frontend (export statique)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Installer les dépendances Python + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller
      - name: Identifiants de build (VERSION bundlée + COMMIT)
        shell: bash
        run: |
          echo "${{ needs.version.outputs.commit_short }}" > COMMIT
          if [ "${{ needs.version.outputs.channel }}" = "beta" ]; then
            echo "${{ needs.version.outputs.display_version }}" > VERSION
          fi
      - name: Construire BobineBackend.exe + BobineTray.exe
        working-directory: backend
        run: pyinstaller ../packaging/windows/bobine.spec
      - name: Fournir ffmpeg.exe/ffprobe.exe (build statique BtbN, appelés par nom nu par le backend)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extracted
          $bin = Get-ChildItem -Path ffmpeg-extracted -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1 -ExpandProperty DirectoryName
          Copy-Item "$bin\ffmpeg.exe" backend\dist\Bobine\
          Copy-Item "$bin\ffprobe.exe" backend\dist\Bobine\
      - name: Vérifier que BobineBackend.exe démarre et répond à /api/health
        working-directory: backend/dist/Bobine
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath ".\BobineBackend.exe" -RedirectStandardError "backend_err.log" -RedirectStandardOutput "backend_out.log" -PassThru
          $ready = $false
          for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 1
              try {
                  $response = Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/health" -UseBasicParsing -TimeoutSec 2
                  if ($response.StatusCode -eq 200) {
                      $ready = $true
                      Write-Host "Backend opérationnel : $($response.Content)"
                      break
                  }
              } catch {
                  # Attente de disponibilité
              }
          }
          if (-not $ready) {
              Write-Host "=== Backend stderr ==="
              if (Test-Path "backend_err.log") { Get-Content "backend_err.log" }
              Write-Host "=== Backend stdout ==="
              if (Test-Path "backend_out.log") { Get-Content "backend_out.log" }
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              exit 1
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
      - name: Compiler l'installeur (Inno Setup, préinstallé sur windows-latest)
        run: ISCC.exe /DMyAppVersion=${{ needs.version.outputs.display_version }} /DMyOutputVersion=${{ needs.version.outputs.filename_version }} packaging\windows\bobine.iss
      - uses: actions/upload-artifact@v4
        with:
          name: bobine-windows-installer
          path: dist-installer/*.exe

  linux-desktop-deb:
    # PortabiliteCrossPlatformX Lot 2 : packaging Linux non-headless (.deb).
    # Construit le frontend Next.js, les exécutables PyInstaller Linux
    # (BobineBackend + BobineTray), assemble l'arborescence Debian et valide
    # l'intégrité et l'installation réelle du paquet .deb sur ubuntu-latest.
    name: Linux desktop packaging (.deb)
    runs-on: ubuntu-latest
    needs: [version]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build du frontend (export statique)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Installer les dépendances Python + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller
      - name: Identifiants de build (VERSION bundlée + COMMIT)
        run: |
          echo "${{ needs.version.outputs.commit_short }}" > COMMIT
          if [ "${{ needs.version.outputs.channel }}" = "beta" ]; then
            echo "${{ needs.version.outputs.display_version }}" > VERSION
          fi
      - name: Construire le paquet Debian (.deb)
        env:
          VERSION: ${{ needs.version.outputs.deb_version }}
          DEB_FILENAME_VERSION: ${{ needs.version.outputs.filename_version }}
        run: |
          ./packaging/linux/build_deb.sh
      - name: Inspecter et valider la structure du paquet .deb
        run: |
          dpkg-deb -I dist-deb/*.deb
          dpkg-deb -c dist-deb/*.deb
      - name: Tester l'installation réelle sur ubuntu-latest
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist-deb/*.deb
          test -x /usr/bin/bobine
          test -f /usr/share/applications/com.bobine.app.desktop
          test -f /usr/share/metainfo/com.bobine.app.metainfo.xml
          test -f /usr/lib/systemd/user/bobine.service
          test -x /usr/lib/bobine/BobineBackend
          test -x /usr/lib/bobine/BobineTray
          test -f /usr/share/icons/hicolor/256x256/apps/bobine.png
          test -f /usr/share/pixmaps/bobine.png
      - uses: actions/upload-artifact@v4
        with:
          name: bobine-linux-deb
          path: dist-deb/*.deb

  macos-build:
    # PortabiliteCrossPlatformX Lot 3 : PyInstaller ne cross-compile pas — ce
    # job est le seul endroit où le packaging macOS (bobine.spec, BUNDLE())
    # est réellement construit sur un vrai macOS. Écrit d'après la
    # documentation officielle PyInstaller/Apple (aucune machine macOS dans
    # l'environnement de développement) — jamais exécuté tel quel avant son
    # premier passage ici, à surveiller de près.
    # `macos-latest` est arm64 uniquement depuis macOS 14 (pas de x86_64 par
    # défaut) : l'étape de signature ad-hoc est OBLIGATOIRE sur ce runner —
    # sans elle, le noyau (AMFI) tue au lancement tout binaire/bibliothèque
    # figé non signé sur Apple Silicon ("Killed: 9"), indépendamment de tout
    # avertissement Gatekeeper (cf. plan §4).
    name: macOS packaging (PyInstaller + dmg)
    runs-on: macos-latest
    needs: [version]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build du frontend (export statique)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Installer les dépendances Python + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller
      - name: Identifiants de build (VERSION bundlée + COMMIT)
        run: |
          echo "${{ needs.version.outputs.commit_short }}" > COMMIT
          if [ "${{ needs.version.outputs.channel }}" = "beta" ]; then
            echo "${{ needs.version.outputs.display_version }}" > VERSION
          fi
      - name: Construire Bobine.app
        working-directory: backend
        run: pyinstaller ../packaging/macos/bobine.spec
      - name: Vérifier la présence de l'icône dans le bundle
        run: test -f backend/dist/Bobine.app/Contents/Resources/bobine.icns
      - name: Signature ad-hoc (requise par le noyau sur Apple Silicon)
        run: codesign --force --deep -s - backend/dist/Bobine.app
      - name: Vérifier que BobineBackend démarre et répond à /api/health
        working-directory: backend/dist/Bobine.app/Contents/MacOS
        run: |
          ./BobineBackend &
          PID=$!
          sleep 5
          curl -sf http://127.0.0.1:8000/api/health
          kill "$PID"
      - name: Créer le .dmg (hdiutil)
        env:
          DMG_FILENAME_VERSION: ${{ needs.version.outputs.filename_version }}
        run: |
          mkdir -p dmg-root dist-dmg
          cp -R backend/dist/Bobine.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Bobine" -srcfolder dmg-root -ov -format UDZO "dist-dmg/Bobine-${DMG_FILENAME_VERSION}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: bobine-macos-dmg
          path: dist-dmg/*.dmg

  # Publie une release STABLE — un tag Vx.y.z par version, historique normal
  # et attendu sur la page GitHub Releases (réf. mission "canal Stable/Bêta").
  release-stable:
    name: Publish Stable Release
    needs: [version, windows-build, linux-desktop-deb, macos-build, assistant-core]
    if: needs.version.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release assets directory
        run: mkdir -p release-assets
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: bobine-windows-installer
          path: release-assets
      - name: Download Linux deb
        uses: actions/download-artifact@v4
        with:
          name: bobine-linux-deb
          path: release-assets
      - name: Download macOS dmg
        uses: actions/download-artifact@v4
        with:
          name: bobine-macos-dmg
          path: release-assets
      - name: Download Linux assistant binary
        uses: actions/download-artifact@v4
        with:
          name: bobine-assistant-linux
          path: release-assets
      - name: Copy install script into release assets
        run: cp install.sh release-assets/
      - name: Inspect generated binary assets
        run: ls -lh release-assets/
      - name: Select Release Notes Body
        id: release-notes
        run: |
          TAG="${{ needs.version.outputs.tag_name }}"
          if [ ! -f "docs/releases/${TAG}.md" ]; then
            echo "::error::docs/releases/${TAG}.md est introuvable — écrire les notes de version avant de publier le tag ${TAG}."
            exit 1
          fi
          echo "body_path=docs/releases/${TAG}.md" >> "$GITHUB_OUTPUT"
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          tag_name: ${{ needs.version.outputs.tag_name }}
          name: Bobine ${{ needs.version.outputs.tag_name }}
          body_path: ${{ steps.release-notes.outputs.body_path }}
          draft: false
          prerelease: false
          generate_release_notes: false

  # Publie/rafraîchit la release BÊTA — un seul tag mobile "beta", republié
  # en place à chaque déclenchement manuel (réf. mission "canal Stable/Bêta"
  # — éviter l'accumulation de releases Bêta sur la page publique). Le tag
  # est force-déplacé sur le commit courant ; les notes sont générées
  # automatiquement (changelog depuis la dernière Stable), pas de fichier
  # docs/releases/ à maintenir pour ce canal (il serait obsolète dès le
  # commit suivant).
  release-beta:
    name: Publish/Update Beta Release
    needs: [version, windows-build, linux-desktop-deb, macos-build, assistant-core]
    if: needs.version.outputs.channel == 'beta'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release assets directory
        run: mkdir -p release-assets
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: bobine-windows-installer
          path: release-assets
      - name: Download Linux deb
        uses: actions/download-artifact@v4
        with:
          name: bobine-linux-deb
          path: release-assets
      - name: Download macOS dmg
        uses: actions/download-artifact@v4
        with:
          name: bobine-macos-dmg
          path: release-assets
      - name: Download Linux assistant binary
        uses: actions/download-artifact@v4
        with:
          name: bobine-assistant-linux
          path: release-assets
      - name: Copy install script into release assets
        run: cp install.sh release-assets/
      - name: Inspect generated binary assets
        run: ls -lh release-assets/
      - name: Force-move the "beta" tag to the current commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f beta "${{ github.sha }}"
          git push origin beta --force
      - name: Generate rolling release notes (README-style layout + changelog since last Stable)
        id: notes
        run: |
          # Bloc statique (bannière + intro + tableau de téléchargement) dans un
          # heredoc ENTIÈREMENT quoté ('NOTES_EOF') : aucune substitution shell,
          # donc tous les backticks/`$`/badges markdown restent littéraux sans
          # avoir besoin d'être échappés un par un. __COMMIT__/__VERSION__ sont
          # remplacés juste après par sed (valeurs courtes, sans caractère
          # spécial pour sed : un SHA court et un "x.y.z"). Chaque ligne du
          # heredoc est indentée pour respecter le bloc scalaire YAML `run: |`
          # (l'indentation commune est retirée par le parseur YAML avant que
          # bash ne voie le script — le fichier markdown généré, lui, n'a
          # bien AUCUNE indentation, sans quoi Markdown le lirait comme un
          # bloc de code).
          cat > /tmp/beta-notes.md <<'NOTES_EOF'
          <p align="center">
            <img alt="Bobine" src="https://raw.githubusercontent.com/FantasmaGlad/Bobine/main/Assets/Images/bobine_banner.svg" width="100%">
          </p>

          # Bobine — Bêta (build automatique)

          Pre-release à accès anticipé aux fonctionnalités en cours de développement — reconstruite automatiquement à chaque publication et republiée **en place** sur ce même tag mobile `beta` (jamais un nouveau tag par itération). Une version stable équivalente ou plus récente la remplace toujours automatiquement.

          Réservée aux utilisateurs ayant activé le canal Bêta ("Programme Bobine Beta" dans Réglages → Mises à jour, `install.sh --channel=beta`, ou l'assistant Tauri).

          **Basé sur** commit `__COMMIT__` · version à venir `__VERSION__`

          ---

          ## Téléchargement

          | Plateforme | Format | Téléchargement direct |
          | :--- | :---: | :--- |
          | ![Windows 11](https://img.shields.io/badge/Windows_11-0078D4?style=flat-square&logo=windows11&logoColor=white) | `.exe` | [**Bobine-Setup-beta.exe**](https://github.com/FantasmaGlad/Bobine/releases/download/beta/Bobine-Setup-beta.exe) |
          | ![Debian](https://img.shields.io/badge/Debian-A81D33?style=flat-square&logo=debian&logoColor=white) ![Ubuntu](https://img.shields.io/badge/Ubuntu-E95420?style=flat-square&logo=ubuntu&logoColor=white) | `.deb` | [**bobine_beta_amd64.deb**](https://github.com/FantasmaGlad/Bobine/releases/download/beta/bobine_beta_amd64.deb) |
          | ![macOS](https://img.shields.io/badge/macOS-000000?style=flat-square&logo=apple&logoColor=white) | `.dmg` | [**Bobine-beta.dmg**](https://github.com/FantasmaGlad/Bobine/releases/download/beta/Bobine-beta.dmg) |
          | ![Bobine Assistant](https://img.shields.io/badge/Bobine_Assistant-FFC131?style=flat-square&logo=tauri&logoColor=black) | Binaire natif | [**bobine-assistant**](https://github.com/FantasmaGlad/Bobine/releases/download/beta/bobine-assistant) |
          | ![Bash CLI](https://img.shields.io/badge/Bash_CLI-4EAA25?style=flat-square&logo=gnubash&logoColor=white) | Script | [**install.sh**](https://github.com/FantasmaGlad/Bobine/releases/download/beta/install.sh) — ou `sudo ./install.sh --channel=beta` sur une installation existante |

          NOTES_EOF
          sed -i "s/__COMMIT__/${{ needs.version.outputs.commit_short }}/; s/__VERSION__/${{ needs.version.outputs.base_version }}/" /tmp/beta-notes.md

          # Bloc dynamique (changelog) ajouté à part, pas via sed : un message
          # de commit peut contenir '/', '&' ou d'autres caractères qui
          # casseraient une substitution sed, et un fence de code (```) rend le
          # changelog bien plus lisible qu'un paragraphe brut (le Markdown
          # fusionne des lignes consécutives sans ligne vide entre elles).
          LAST_STABLE="$(git tag --list 'V*' --sort=-v:refname | grep -E '^V[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          if [ -n "${LAST_STABLE}" ]; then
            CHANGELOG_HEADING="Changements depuis ${LAST_STABLE}"
            CHANGELOG="$(git log "${LAST_STABLE}..HEAD" --oneline --no-merges | head -50)"
          else
            CHANGELOG_HEADING="Changements récents"
            CHANGELOG="$(git log --oneline --no-merges | head -50)"
          fi
          {
            echo "---"
            echo ""
            echo "## ${CHANGELOG_HEADING}"
            echo ""
            echo '```'
            echo "${CHANGELOG}"
            echo '```'
            echo ""
            echo "---"
            echo ""
            echo "Retour à la Stable à tout moment, sans perte de données : Réglages → Mises à jour logicielles → « Programme Bobine Beta » → Stable."
          } >> /tmp/beta-notes.md
          echo "notes_path=/tmp/beta-notes.md" >> "$GITHUB_OUTPUT"
      - name: Delete previous Beta release (assets get fully replaced, not merged)
        run: gh release delete beta --yes || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish Beta release
        run: |
          gh release create beta release-assets/* \
            --title "Bobine — Bêta (build automatique)" \
            --notes-file "${{ steps.notes.outputs.notes_path }}" \
            --prerelease \
            --target "${{ github.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}


