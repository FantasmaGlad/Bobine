          | ![](https://img.shields.io/badge/Android_TV-009688?style=flat-square&logo=androidtv&logoColor=white) | `.apk` | ARM 32/64 bits | [**Bobine-TV-beta.apk**](https://github.com/FantasmaGlad/Bobine/releases/download/beta/Bobine-TV-beta.apk) |
          | ![](https://img.shields.io/badge/Debian-A81D33?style=flat-square&logo=debian&logoColor=white) ![](https://img.shields.io/badge/Ubuntu-E95420?style=flat-square&logo=ubuntu&logoColor=white) | `.deb` | x86-64 / ARM64 | [**bobine_beta_amd64.deb**](https://github.com/FantasmaGlad/Bobine/releases/download/beta/bobine_beta_amd64.deb) (amd64)<br>[**bobine_beta_arm64.deb**](https://github.com/FantasmaGlad/Bobine/releases/download/beta/bobine_beta_arm64.deb) (arm64) |
