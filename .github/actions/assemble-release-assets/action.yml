name: Assembler les assets d'une release de Bobine
description: >-
  Télécharge les artefacts des builds, nomme les APK, rassemble les paquets Linux, signe SHA256SUMS et vérifie la
  complétude (scripts/ci/verify-release-assets.sh). Commun aux releases Stable, Canary et Bêta ; le dépôt doit déjà
  être récupéré (checkout). Résultat : le dossier release-assets/.
inputs:
  suffix:
    description: Suffixe des noms d'assets, la version (5.1.0) pour la Stable, le canal (canary, beta) sinon.
    required: true
  winget-tag:
    description: Tag Stable pour lequel joindre les manifestes winget (vide = aucun manifeste).
    required: false
    default: ''
  signing-key:
    description: Clé privée GPG de signature de SHA256SUMS (secret APT_GPG_PRIVATE_KEY, à passer par l'appelant).
    required: true
runs:
  using: composite
  steps:
    - name: Create release assets directory
      shell: bash
      run: mkdir -p release-assets
    - name: Download Windows installer
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: bobine-windows-installer
        path: release-assets
    - name: Download Windows ARM64 installer
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: bobine-windows-installer-arm64
        path: release-assets
    - name: Download Linux deb
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: bobine-linux-deb
        path: release-assets
    - name: Download Linux ARM64 deb
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: bobine-linux-deb-arm64
        path: release-assets
    - name: Download macOS dmg
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: bobine-macos-dmg
        path: release-assets
    - name: Download Android APK
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: bobine-android-apk
        path: android-artifact
    - name: Download Android TV APK
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: bobine-android-tv-apk
        path: android-tv-artifact
    - name: Prepare Android APK assets
      shell: bash
      env:
        SUFFIX: ${{ inputs.suffix }}
      run: |
        APK_SRC=$(ls android-artifact/*.apk | head -1)
        cp "$APK_SRC" "release-assets/Bobine-${SUFFIX}.apk"
        echo "Android APK copié : release-assets/Bobine-${SUFFIX}.apk"
        APK_TV_SRC=$(ls android-tv-artifact/*.apk | head -1)
        cp "$APK_TV_SRC" "release-assets/Bobine-TV-${SUFFIX}.apk"
        echo "Android TV APK copié : release-assets/Bobine-TV-${SUFFIX}.apk"
    - name: Télécharger les paquets Fedora et Arch
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: bobine-linux-packages-signed
        path: package-assets
    - name: Rassembler les paquets Linux
      shell: bash
      run: find package-assets -type f \( -name '*.rpm' -o -name '*.pkg.tar.zst' -o -name '*.pkg.tar.zst.sig' \) -exec cp {} release-assets/ \;
    - name: Copy install script into release assets
      shell: bash
      run: |
        cp install.sh release-assets/
        if [ -f packaging/windows/install.ps1 ]; then cp packaging/windows/install.ps1 release-assets/; fi
    - name: Manifestes winget (joints à la release, soumission manuelle)
      if: inputs.winget-tag != ''
      shell: bash
      env:
        WINGET_TAG: ${{ inputs.winget-tag }}
      run: |
        if [ -f scripts/ci/winget-manifests.py ]; then
          (cd release-assets && sha256sum Bobine-Setup-*.exe) > "$RUNNER_TEMP/winget-SHA256SUMS"
          python3 scripts/ci/winget-manifests.py "$RUNNER_TEMP/winget-SHA256SUMS" "$WINGET_TAG" release-assets
        fi
    - name: Signer la liste des empreintes (SHA256SUMS)
      shell: bash
      env:
        APT_GPG_PRIVATE_KEY: ${{ inputs.signing-key }}
        GNUPGHOME: ${{ runner.temp }}/bobine-signing
      run: |
        install -d -m 0700 "$GNUPGHOME"
        printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
        bash scripts/ci/sign-release-checksums.sh release-assets
        if [ -f scripts/ci/test-install-signature.ps1 ]; then pwsh -NoProfile -File scripts/ci/test-install-signature.ps1 release-assets; fi
    - name: Retirer la clé privée du runner
      if: always()
      shell: bash
      env:
        GNUPGHOME: ${{ runner.temp }}/bobine-signing
      run: |
        gpgconf --kill gpg-agent || true
        rm -rf "$GNUPGHOME"
    - name: Vérifier la complétude des assets
      shell: bash
      env:
        SUFFIX: ${{ inputs.suffix }}
      run: scripts/ci/verify-release-assets.sh release-assets "$SUFFIX"
    - name: Inspect generated binary assets
      shell: bash
      run: ls -lh release-assets/
